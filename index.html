<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>크레이음 인스타 스튜디오</title>
  <style>
    :root{--navy:#111b35;--mint:#55d8bd;--coral:#ff6f7d;--cream:#fff3d1;--butter:#ffd65a;--paper:#f7f4ee;--line:#dde4ed;--muted:#617084;--white:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}button,input,select,textarea{font:inherit}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy);font-weight:850;padding:0 13px;cursor:pointer}.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
    .wrap{display:grid;grid-template-columns:minmax(320px,400px) 1fr;min-height:100vh}.side{display:grid;align-content:start;gap:14px;padding:22px;background:#fff;border-right:1px solid var(--line)}.brand{display:flex;gap:12px;align-items:center}.brand img{width:74px;height:74px;object-fit:contain}.brand p{margin:0;color:var(--coral);font-size:12px;font-weight:900;text-transform:uppercase}.brand h1{margin:2px 0 0;font-size:22px}.panel{display:grid;gap:12px;border:1px solid var(--line);border-radius:8px;padding:15px;background:#fff;box-shadow:0 8px 20px rgba(17,27,53,.05)}h2,h3{margin:0}h2{font-size:18px}h3{font-size:15px}.seg,.grid,.parents{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.seg label{position:relative}.seg input{position:absolute;opacity:0}.seg span{display:grid;place-items:center;min-height:42px;border:1px solid var(--line);border-radius:8px;background:#fafbfc;font-weight:900;color:var(--muted)}.seg input:checked+span{border-color:var(--navy);background:#e8fbf6;color:var(--navy)}
    label{display:grid;gap:7px;color:var(--muted);font-size:13px;font-weight:750}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--navy)}textarea{resize:vertical}.drop{min-height:98px;border:1px dashed #8ed8ca;border-radius:8px;background:#e8fbf6;place-items:center;text-align:center;cursor:pointer}.drop input,.small-drop input{display:none}.drop b,.small-drop b{color:var(--navy)}.drop small{display:block;margin-top:4px;color:var(--muted)}.small-drop{min-height:58px;border:1px dashed #8ed8ca;border-radius:8px;background:#fafbfc;place-items:center;text-align:center;cursor:pointer}.small-drop.done{border-style:solid;border-color:var(--mint);background:#e8fbf6}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.sw i{height:30px;border-radius:8px;border:1px solid var(--line)}
    .work{padding:22px;overflow:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.preview{display:grid;grid-template-columns:minmax(330px,570px) minmax(320px,1fr);gap:18px;align-items:start}.card,.copy{border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 18px 45px rgba(17,27,53,.12);padding:14px}canvas{display:block;width:100%;height:auto;border-radius:8px;background:var(--cream)}.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.slide{padding:0;border-radius:8px;overflow:hidden}.slide img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}.slide span{display:block;padding:7px;font-size:11px;color:var(--muted)}.on{outline:3px solid rgba(85,216,189,.42)}.copy{display:grid;gap:12px}.copy textarea{min-height:132px;line-height:1.55}
    @media(max-width:1050px){.wrap,.preview{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}}@media(max-width:640px){.side,.work{padding:15px}.bar{display:grid}.grid,.parents{grid-template-columns:1fr}.strip{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<main class="wrap">
  <aside class="side">
    <div class="brand"><img src="assets/cre-eum-logo.png?v=verified-96cf860" alt="크레이음 로고"><div><p>CRE-EUM Studio</p><h1>크레이음 인스타 스튜디오</h1></div></div>
    <section class="panel"><h2>콘텐츠 유형</h2><div class="seg"><label><input type="radio" name="type" value="hatching" checked><span>해칭</span></label><label><input type="radio" name="type" value="individual"><span>개체</span></label><label><input type="radio" name="type" value="care"><span>사육정보</span></label><label><input type="radio" name="type" value="reels"><span>릴스</span></label></div></section>
    <section class="panel"><h2>브랜드 색감</h2><div class="sw"><i style="background:#111b35"></i><i style="background:#55d8bd"></i><i style="background:#ff6f7d"></i><i style="background:#fff3d1"></i><i style="background:#ffd65a"></i></div></section>
    <section class="panel"><h2>사진</h2><label class="drop" for="photos"><input id="photos" type="file" accept="image/*" multiple><b>개체 사진 2~4장 업로드</b><small>첫 장은 여러 컷, 뒤 장은 사진 한 장씩 크게 제작됩니다.</small></label><div id="thumbs" class="thumbs"></div><div class="parents"><label class="small-drop" for="sirePhoto"><input id="sirePhoto" type="file" accept="image/*"><b>부 개체 사진</b></label><label class="small-drop" for="damPhoto"><input id="damPhoto" type="file" accept="image/*"><b>모 개체 사진</b></label></div></section>
    <section class="panel"><h2>개체정보</h2><div class="grid"><label>개체 ID<input id="id" placeholder="예: CR-260520-01"></label><label>모프<input id="morph" placeholder="예: 논릴리 / 모자이크"></label><label>해칭일<input id="date" type="date"></label><label>체중<input id="weight" placeholder="예: 5.8g"></label><label>부 개체<input id="sire" placeholder="Sire"></label><label>모 개체<input id="dam" placeholder="Dam"></label><label>먹이반응<select id="feeding"><option>안정적</option><option>관찰 중</option><option>매우 적극적</option><option>개체별 안내 필요</option></select></label><label>추천등급<select id="rating"><option value="1">★ 추천</option><option value="2" selected>★★ 추천</option><option value="3">★★★ 추천</option></select></label></div><label>개체 메모<textarea id="notes" rows="4" placeholder="사진과 함께 들어갈 짧은 설명을 적어주세요."></textarea></label><label>사육정보 주제<input id="topic" placeholder="예: 온도 관리, 유체 단독사육"></label></section>
  </aside>
  <section class="work"><header class="bar"><div><p style="margin:0;color:#ff6f7d;font-weight:900;font-size:12px">Preview</p><h2>인스타 캐러셀 초안</h2></div><div class="actions"><button id="make" class="primary">자동 제작</button><button id="png">현재 PNG</button><button id="all">전체 PNG</button><button id="csv">Canva CSV</button></div></header><div class="preview"><section class="card"><canvas id="cv" width="1080" height="1350"></canvas><div id="strip" class="strip"></div></section><section class="copy"><h3>캡션</h3><textarea id="caption"></textarea><h3>카드 문구</h3><textarea id="slides"></textarea><h3>릴스 구성</h3><textarea id="reels"></textarea></section></div></section>
</main>
<script>
(()=>{const $=id=>document.getElementById(id),cv=$("cv"),g=cv.getContext("2d"),P={navy:"#111B35",mint:"#55D8BD",coral:"#FF6F7D",cream:"#FFF3D1",paper:"#FFFCF7",muted:"#617084",white:"#fff",butter:"#FFD65A"},S={imgs:[],sire:null,dam:null,sel:0,urls:[],specs:[]},brand={ko:"크레이음",en:"CRE-EUM",tag:"단 하나의 크레"};const logo=new Image(),mascot=new Image();logo.src="assets/cre-eum-logo.png?v=verified-96cf860";mascot.src="assets/cre-eum-character.png?v=verified-96cf860";logo.onload=mascot.onload=logo.onerror=mascot.onerror=()=>make();window.__creimeCheck=()=>({logo:{ok:logo.complete,w:logo.naturalWidth,h:logo.naturalHeight},character:{ok:mascot.complete,w:mascot.naturalWidth,h:mascot.naturalHeight},parents:{sire:!!S.sire,dam:!!S.dam}});
const T={hatching:{name:"해칭노트",badge:"HATCHING",main:P.butter,accent:P.coral,soft:"#FFF8D8",tag:"#해칭노트"},individual:{name:"이음매칭",badge:"MATCHING",main:P.coral,accent:P.mint,soft:"#FFF0F2",tag:"#이음매칭"},care:{name:"사육노트",badge:"CARE",main:P.mint,accent:P.coral,soft:"#E8FBF6",tag:"#사육노트"},reels:{name:"릴스훅",badge:"REELS",main:P.navy,accent:P.coral,soft:"#F3F6FF",tag:"#크레릴스"}};
const kind=()=>document.querySelector('[name=type]:checked').value,theme=()=>T[kind()],val=(id,f="")=>$(id).value.trim()||f,star=()=>"★".repeat(Math.max(1,Math.min(3,+val("rating","2")||2))),safe=s=>String(s||"cre-eum").replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g,"-"),metrics=im=>({w:im?.naturalWidth||im?.width||0,h:im?.naturalHeight||im?.height||0});
function read(file){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>ok({file,url:r.result,img:im});im.src=r.result};r.readAsDataURL(file)})}
$("photos").onchange=async e=>{S.imgs=await Promise.all([...e.target.files].slice(0,4).map(read));S.sel=0;thumbs();make()};async function parent(e,key,label){const file=e.target.files?.[0];if(!file)return;S[key]=await read(file);e.target.closest("label").classList.add("done");e.target.closest("label").querySelector("b").textContent=label;make()}$("sirePhoto").onchange=e=>parent(e,"sire","부 개체 적용됨");$("damPhoto").onchange=e=>parent(e,"dam","모 개체 적용됨");
document.querySelectorAll('input,select,textarea').forEach(e=>{if(e.type!=='file'){e.oninput=make;e.onchange=make}});document.querySelectorAll('[name=type]').forEach(e=>e.onchange=()=>{S.sel=0;make()});function thumbs(){const t=$("thumbs");t.innerHTML="";S.imgs.forEach(a=>{const im=new Image();im.src=a.url;t.appendChild(im)})}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}function fill(x,y,w,h,r){rr(x,y,w,h,r);g.fill()}function stroke(x,y,w,h,r){rr(x,y,w,h,r);g.stroke()}
function contain(im,x,y,w,h,p=0){const m=metrics(im);if(!m.w||!m.h)return false;const iw=w-p*2,ih=h-p*2,s=Math.min(iw/m.w,ih/m.h),dw=m.w*s,dh=m.h*s;g.drawImage(im,0,0,m.w,m.h,x+p+(iw-dw)/2,y+p+(ih-dh)/2,dw,dh);return true}
function cover(im,x,y,w,h,r=26,msg="사진을 업로드해 주세요"){g.save();rr(x,y,w,h,r);g.clip();const m=metrics(im);if(!m.w||!m.h){g.fillStyle="#E8FBF6";g.fillRect(x,y,w,h);g.fillStyle=P.muted;g.font="800 30px sans-serif";g.textAlign="center";g.fillText(msg,x+w/2,y+h/2);g.restore();return}const sr=m.w/m.h,tr=w/h;let sx=0,sy=0,sw=m.w,sh=m.h;if(sr>tr){sw=m.h*tr;sx=(m.w-sw)/2}else{sh=m.w/tr;sy=(m.h-sh)/2}g.drawImage(im,sx,sy,sw,sh,x,y,w,h);g.restore()}
function wrap(txt,x,y,mw,lh,max=2){const arr=String(txt||"").split("\n").flatMap(p=>/\s/.test(p)?p.split(/(\s+)/).filter(Boolean):[...p]);let line="",lines=[];for(const u of arr){const test=line+u;if(g.measureText(test).width>mw&&line){lines.push(line.trim());line=u.trimStart()}else line=test}if(line)lines.push(line.trim());lines.slice(0,max).forEach((l,i)=>g.fillText(l,x,y+i*lh))}
function fallbackChar(x,y,s){g.save();g.translate(x,y);g.scale(s/180,s/180);g.lineCap="round";g.lineJoin="round";g.fillStyle="#FFF3D1";g.strokeStyle=P.navy;g.lineWidth=8;g.beginPath();g.ellipse(78,86,45,60,-.2,0,Math.PI*2);g.fill();g.stroke();g.beginPath();g.ellipse(128,98,52,40,.1,0,Math.PI*2);g.fill();g.stroke();g.fillStyle=P.butter;[0,1,2].forEach(i=>{g.beginPath();g.ellipse(45,34+i*30,15,22,0,0,Math.PI*2);g.fill();g.stroke()});g.fillStyle=P.navy;g.beginPath();g.arc(98,78,6,0,Math.PI*2);g.arc(138,82,6,0,Math.PI*2);g.fill();g.strokeStyle=P.navy;g.lineWidth=5;g.beginPath();g.arc(119,91,10,.2,Math.PI-.2);g.stroke();g.restore()}
function bg(t){g.clearRect(0,0,1080,1350);g.fillStyle=P.paper;g.fillRect(0,0,1080,1350);g.fillStyle=t.soft;fill(0,0,1080,148,0);g.fillStyle=t.main;fill(0,0,18,148,0)}function pill(txt,right,y,bg,c=P.navy){g.font="900 22px sans-serif";const w=g.measureText(txt).width+34;g.fillStyle=bg;fill(right-w,y,w,44,13);g.fillStyle=c;g.textAlign="left";g.fillText(txt,right-w+17,y+30)}function header(t,label,i,n){contain(logo,34,8,136,136,10);g.fillStyle=P.navy;g.font="900 38px sans-serif";g.textAlign="left";g.fillText(brand.en,200,73);g.fillStyle=P.muted;g.font="800 22px sans-serif";g.fillText(`${brand.ko} · ${brand.tag}`,200,110);pill(`${i}/${n}`,1012,52,P.white);pill(label,908,52,t.main,label.length>8?P.white:P.navy)}
function chip(k,v,x,y,w,t){g.fillStyle=P.white;fill(x,y,w,54,14);g.strokeStyle="rgba(17,27,53,.08)";g.lineWidth=2;stroke(x,y,w,54,14);g.fillStyle=t.accent;g.font="900 14px sans-serif";g.textAlign="left";g.fillText(k,x+15,y+22);g.fillStyle=P.navy;g.font="900 19px sans-serif";wrap(v,x+15,y+43,w-30,22,1)}
function foot(t){g.strokeStyle=t.accent;g.lineWidth=7;g.lineCap="round";g.beginPath();g.moveTo(70,1286);g.lineTo(196,1286);g.stroke();g.strokeStyle=t.main;for(let i=0;i<3;i++){g.beginPath();g.moveTo(226+i*22,1297);g.lineTo(234+i*22,1274);g.stroke()}g.fillStyle=P.navy;g.font="900 24px sans-serif";g.textAlign="right";g.fillText("@creeum",1010,1295)}
function collage(imgs,x,y,w,h){const ar=imgs.filter(Boolean),gap=12;if(!ar.length)return cover(null,x,y,w,h);if(ar.length===1)return cover(ar[0],x,y,w,h);if(ar.length===2){const cw=(w-gap)/2;cover(ar[0],x,y,cw,h);cover(ar[1],x+cw+gap,y,cw,h);return}if(ar.length===3){const lw=w*.6,rw=w-lw-gap,rh=(h-gap)/2;cover(ar[0],x,y,lw,h);cover(ar[1],x+lw+gap,y,rw,rh);cover(ar[2],x+lw+gap,y+rh+gap,rw,rh);return}const cw=(w-gap)/2,ch=(h-gap)/2;ar.slice(0,4).forEach((im,i)=>cover(im,x+(i%2)*(cw+gap),y+Math.floor(i/2)*(ch+gap),cw,ch))}
function parentPanel(c){const ps=[{l:"부",n:val("sire","Sire"),im:S.sire?.img},{l:"모",n:val("dam","Dam"),im:S.dam?.img}].filter(p=>p.im);if(!ps.length)return;const x=718,y=790,w=284,h=218,gap=12,cw=ps.length===1?w-36:(w-48)/2,ih=118;g.save();g.fillStyle="rgba(255,255,255,.94)";fill(x,y,w,h,24);g.strokeStyle="rgba(17,27,53,.12)";g.lineWidth=2;stroke(x,y,w,h,24);g.fillStyle=c.t.accent;fill(x+18,y+18,78,30,10);g.fillStyle=P.white;g.font="900 15px sans-serif";g.textAlign="center";g.fillText("부·모",x+57,y+39);g.fillStyle=P.navy;g.font="900 18px sans-serif";g.textAlign="left";g.fillText("부모 개체",x+108,y+40);ps.forEach((p,i)=>{const px=x+18+i*(cw+gap),py=y+62;cover(p.im,px,py,cw,ih,16,"");g.fillStyle=p.l==="부"?P.navy:c.t.accent;fill(px,py+ih+10,30,28,9);g.fillStyle=P.white;g.font="900 15px sans-serif";g.textAlign="center";g.fillText(p.l,px+15,py+ih+30);g.fillStyle=P.navy;g.font="800 15px sans-serif";g.textAlign="left";wrap(p.n,px+38,py+ih+30,cw-42,18,1)});g.restore()}
function data(){const t=theme(),id=val("id","CRE-EUM PICK"),m=val("morph","크레스티드게코"),note=val("notes","개체의 패턴, 컨디션, 먹이반응을 확인하여 크레이음 기준에 맞춰 안내합니다.");return{t,id,m,note,stars:star(),feed:val("feeding","안정적"),weight:val("weight","기록 중"),head:kind()==="hatching"?"해칭 기록, 첫 번째 이음":kind()==="care"?val("topic","사육환경 체크"):kind()==="reels"?"3초 안에 시선을 잡는 컷":`${id} 개체 소개`,photo:kind()==="hatching"?"해칭 포인트 컷":kind()==="care"?"사육노트 컷":kind()==="reels"?"릴스용 컷":"개체 포인트 컷"}}
function specs(){const p=S.imgs.length?S.imgs.map(a=>a.img):[null];return[{kind:"info",images:p},...p.map(image=>({kind:"photo",image}))]}function info(sp,c,i,n){bg(c.t);header(c.t,c.t.badge,i+1,n);collage(sp.images,54,174,972,860);parentPanel(c);g.fillStyle="rgba(255,255,255,.94)";fill(54,1062,972,168,26);g.strokeStyle="rgba(17,27,53,.08)";g.lineWidth=2;stroke(54,1062,972,168,26);g.fillStyle=c.t.accent;fill(54,1062,12,168,6);if(!contain(mascot,82,1084,126,126,6))fallbackChar(84,1088,112);g.fillStyle=P.navy;g.font="900 32px sans-serif";g.textAlign="left";wrap(c.head,228,1112,740,38,1);g.fillStyle=P.muted;g.font="800 20px sans-serif";wrap(c.note,228,1150,740,28,2);[["추천",c.stars],["ID",c.id],["모프",c.m],["체중",c.weight]].forEach((a,j)=>chip(a[0],a[1],228+j*190,1184,174,c.t));foot(c.t)}
function photo(sp,c,i,n){bg(c.t);header(c.t,"PHOTO",i+1,n);cover(sp.image,54,172,972,1048,30);g.fillStyle="rgba(255,255,255,.9)";fill(78,1124,924,76,22);g.fillStyle=c.t.main;fill(78,1124,10,76,5);g.fillStyle=P.navy;g.font="900 28px sans-serif";g.textAlign="left";wrap(c.photo,108,1172,430,32,1);g.fillStyle=P.muted;g.font="800 21px sans-serif";g.textAlign="right";g.fillText(`${c.stars} · ${c.id}`,972,1172);foot(c.t)}
function draw(sp,c,i,n){sp.kind==="info"?info(sp,c,i,n):photo(sp,c,i,n)}function text(c,sp){const tags=`#크레이음 #CREEUM ${c.t.tag} #크레스티드게코 #크레분양 #올바른사육정보 #논릴리 #모자이크`;$("caption").value=`[${c.t.name}]\n${c.id} ${c.m}\n\n추천등급: ${c.stars}\n먹이반응: ${c.feed}\n\n${c.note}\n\n단 하나의 크레를 이어주는 것이 크레이음의 기준입니다.\n\n${tags}`;$("slides").value=sp.map((s,i)=>i?`${i+1}장: 사진 한 장을 크게 보여주는 컷`:`${i+1}장: 여러 컷 대표 콜라주 + 작은 설명${S.sire||S.dam?" + 부모 개체 사진":""}`).join("\n");$("reels").value=`릴스 대본\n0-2초: 얼굴 또는 패턴 클로즈업\n3-5초: ${c.m} 포인트 컷\n6-9초: 손 위 움직임 또는 먹이반응\n10-13초: 전체 체형 컷\n14-16초: 단 하나의 크레, 크레이음에서 이음`}
function render(){const s=$("strip");s.innerHTML="";S.urls.forEach((u,i)=>{const b=document.createElement("button");b.className="slide"+(i===S.sel?" on":"");const im=new Image();im.src=u;const label=document.createElement("span");label.textContent=i?`${i+1} 큰 사진`:"1 대표 콜라주";b.append(im,label);b.onclick=()=>{S.sel=i;draw(S.specs[i],data(),i,S.specs.length);render()};s.appendChild(b)})}function make(){const c=data(),sp=specs();S.specs=sp;if(S.sel>=sp.length)S.sel=0;S.urls=sp.map((one,i)=>{draw(one,c,i,sp.length);return cv.toDataURL("image/png")});draw(sp[S.sel],c,S.sel,sp.length);render();text(c,sp)}function down(url,name){const a=document.createElement("a");a.href=url;a.download=name;a.click()}$("make").onclick=make;$("png").onclick=()=>down(cv.toDataURL("image/png"),`${safe(val("id","cre-eum"))}-card-${S.sel+1}.png`);$("all").onclick=()=>{make();S.urls.forEach((u,i)=>setTimeout(()=>down(u,`${safe(val("id","cre-eum"))}-card-${i+1}.png`),i*220))};$("csv").onclick=()=>{const rows=[["Slide","Type","Brand","Title","Rating"],...S.specs.map((s,i)=>[i+1,s.kind,brand.en,i?"Photo":"Info",star()])],csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n"),blob=new Blob(["\ufeff"+csv],{type:"text/csv"}),url=URL.createObjectURL(blob);down(url,`${safe(val("id","cre-eum"))}-canva.csv`);URL.revokeObjectURL(url)};make();})();
</script>
