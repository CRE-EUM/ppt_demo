<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>크레이음 인스타 스튜디오</title>
<style>
:root{--navy:#111b35;--mint:#55d8bd;--mint2:#e8fbf6;--coral:#ff6f7d;--coral2:#fff0f2;--cream:#fff3d1;--butter:#ffd65a;--paper:#fffaf3;--line:#dde4ed;--muted:#617084;--page:#f5f3ee;--white:#fff;--shadow:0 18px 45px rgba(17,27,53,.12)}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}button,input,select,textarea{font:inherit}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy);padding:0 14px;cursor:pointer;font-weight:850}.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.shell{display:grid;grid-template-columns:minmax(320px,390px) 1fr;min-height:100vh}.side{display:flex;flex-direction:column;gap:16px;padding:24px;background:rgba(255,255,255,.95);border-right:1px solid var(--line);overflow:auto}.brand{display:flex;align-items:center;gap:14px}.mark{display:grid;place-items:center;width:54px;height:54px;border-radius:8px;background:var(--navy);color:#fff;font-size:28px;font-weight:950}.eyebrow{margin:0 0 4px;color:var(--coral);font-size:12px;font-weight:950;text-transform:uppercase}.brand h1,.work h2,h3{margin:0}.panel{display:grid;gap:14px;padding:16px;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 8px 22px rgba(17,27,53,.05)}.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.seg label{position:relative}.seg input{position:absolute;opacity:0}.seg span{display:grid;place-items:center;min-height:42px;border:1px solid var(--line);border-radius:8px;background:#fafbfc;color:var(--muted);font-weight:950}.seg input:checked+span{background:var(--mint2);border-color:var(--navy);color:var(--navy)}label{display:grid;gap:7px;color:var(--muted);font-size:13px;font-weight:800}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy);padding:10px 11px;outline:none}textarea{resize:vertical}.drop,.mini{min-height:58px;align-content:center;justify-items:center;border:1px dashed #8ed8ca;border-radius:8px;background:var(--mint2);text-align:center;cursor:pointer}.drop{min-height:106px}.drop input,.mini input{display:none}.drop span,.mini span{font-weight:950;color:var(--navy)}.drop small{color:var(--muted);font-weight:650}.grid,.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.swatches span{height:34px;border-radius:8px;border:1px solid var(--line)}.navy{background:var(--navy)}.mint{background:var(--mint)}.coral{background:var(--coral)}.cream{background:var(--cream)}.butter{background:var(--butter)}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.thumbs img{width:100%;aspect-ratio:1;border-radius:8px;object-fit:cover;border:1px solid var(--line)}.work{padding:24px;overflow:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.actions{display:flex;flex-wrap:wrap;gap:8px}.preview{display:grid;grid-template-columns:minmax(340px,570px) minmax(360px,1fr);gap:18px;align-items:start}.card,.copy{border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:var(--shadow)}.card{display:grid;gap:12px;padding:14px}canvas{display:block;width:100%;height:auto;border-radius:8px;background:var(--cream)}.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.st{display:grid;gap:6px;min-height:0;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}.st img{width:100%;aspect-ratio:4/5;object-fit:cover}.st span{padding:0 8px 8px;color:var(--muted);font-size:11px;font-weight:950;text-align:left}.st.on{border-color:var(--navy);box-shadow:0 0 0 3px rgba(85,216,189,.22)}.copy{display:grid;gap:12px;padding:14px}.section{display:grid;gap:8px}.section-title{display:flex;align-items:center;justify-content:space-between}.section-title button{min-height:32px;font-size:13px}.section textarea{min-height:120px;line-height:1.55}.check{display:grid;gap:9px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--mint2)}.check label{grid-template-columns:18px 1fr;color:var(--navy);font-weight:650}.check input{width:auto;margin-top:2px}@media(max-width:1050px){.shell,.preview{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}}@media(max-width:640px){.side,.work{padding:16px}.toolbar{align-items:stretch;flex-direction:column}.actions button{flex:1}.grid,.two{grid-template-columns:1fr}.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="shell">
<aside class="side">
<div class="brand"><div class="mark">C</div><div><p class="eyebrow">CRE-EUM Studio</p><h1>크레이음 인스타 스튜디오</h1></div></div>
<section class="panel"><h3>콘텐츠 유형</h3><div class="seg"><label><input type="radio" name="type" value="hatching" checked><span>해칭</span></label><label><input type="radio" name="type" value="individual"><span>개체</span></label><label><input type="radio" name="type" value="care"><span>사육정보</span></label><label><input type="radio" name="type" value="reels"><span>릴스</span></label></div></section>
<section class="panel"><h3>브랜드 이미지</h3><div class="swatches"><span class="navy"></span><span class="mint"></span><span class="coral"></span><span class="cream"></span><span class="butter"></span></div><p style="margin:0;color:var(--muted);font-size:13px;line-height:1.55;font-weight:650">로고는 크게, 캐릭터는 첫 장 왼쪽 하단에만 작게 들어갑니다.</p><div class="two"><label class="mini" for="logo"><input id="logo" type="file" accept="image/*"><span>로고 이미지</span></label><label class="mini" for="mascot"><input id="mascot" type="file" accept="image/*"><span>해칭 포즈</span></label></div></section>
<section class="panel"><h3>사진</h3><label class="drop" for="photos"><input id="photos" type="file" accept="image/*" multiple><span>개체 사진 2~4장 업로드</span><small>첫 장은 여러 컷 콜라주, 뒤 장은 사진 한 장씩 크게 제작됩니다.</small></label><div id="thumbs" class="thumbs"></div></section>
<section class="panel"><h3>개체정보</h3><div class="grid"><label>개체 ID<input id="id" placeholder="예: CR-260519-01"></label><label>모프<input id="morph" placeholder="예: 논릴리 / 모자이크"></label><label>해칭일<input id="date" type="date"></label><label>체중<input id="weight" placeholder="예: 5.8g"></label><label>부 개체<input id="sire" placeholder="예: Sire name"></label><label>모 개체<input id="dam" placeholder="예: Dam name"></label><label>먹이반응<select id="feeding"><option>안정적</option><option>관찰 중</option><option>매우 적극적</option><option>개체별 안내 필요</option></select></label><label>추천등급<select id="rating"><option value="1">★ 추천</option><option value="2" selected>★★ 추천</option><option value="3">★★★ 추천</option></select></label></div><label>개체 메모<textarea id="notes" rows="4" placeholder="사진에 함께 들어갈 짧은 설명을 적어주세요."></textarea></label><label>사육정보 주제<input id="topic" placeholder="예: 온도 관리, 유체 단독사육, 먹이반응"></label></section>
</aside>
<section class="work"><header class="toolbar"><div><p class="eyebrow">Preview</p><h2>인스타 캐러셀 초안</h2></div><div class="actions"><button id="make" class="primary">자동 제작</button><button id="png">현재 PNG</button><button id="all">전체 PNG</button><button id="csv">Canva CSV</button></div></header><div class="preview"><section class="card"><canvas id="canvas" width="1080" height="1350"></canvas><div id="strip" class="strip"></div></section><section class="copy"><div class="section"><div class="section-title"><h3>캡션</h3><button data-copy="caption">복사</button></div><textarea id="caption"></textarea></div><div class="section"><div class="section-title"><h3>카드 문구</h3><button data-copy="slides">복사</button></div><textarea id="slides"></textarea></div><div class="section"><div class="section-title"><h3>릴스 구성</h3><button data-copy="reels">복사</button></div><textarea id="reels"></textarea></div><div class="check"><h3>업로드 전 확인</h3><label><input type="checkbox"> 사진이 첫 장에서 충분히 크게 보임</label><label><input type="checkbox"> 개체 메모가 자연스럽게 보임</label><label><input type="checkbox"> 추천등급 기준 확인</label><label><input type="checkbox"> 사육정보 기준 확인</label></div></section></div></section>
</main>
<script>
const S={imgs:[],logo:null,mascot:null,sel:0,urls:[],specs:[]},$=id=>document.getElementById(id),C=$('canvas'),X=C.getContext('2d'),B={ko:'크레이음',en:'CRE-EUM',tag:'단 하나의 크레'},P={navy:'#111B35',mint:'#55D8BD',mint2:'#E8FBF6',coral:'#FF6F7D',coral2:'#FFF0F2',cream:'#FFF3D1',butter:'#FFD65A',butter2:'#FFF8D8',white:'#FFFFFF',paper:'#FFFCF7',line:'#DDE4ED',muted:'#617084'},T={hatching:{pillar:'해칭노트',badge:'HATCHING',primary:P.butter,accent:P.coral,soft:P.butter2,tag:'#해칭노트'},individual:{pillar:'이음매칭',badge:'MATCHING',primary:P.coral,accent:P.mint,soft:P.coral2,tag:'#이음매칭'},care:{pillar:'사육노트',badge:'CARE',primary:P.mint,accent:P.coral,soft:P.mint2,tag:'#사육노트'},reels:{pillar:'릴스훅',badge:'REELS',primary:P.navy,accent:P.coral,soft:'#F3F6FF',tag:'#크레릴스'}};
function type(){return document.querySelector('input[name="type"]:checked').value}function th(){return T[type()]}function v(id,fb=''){return $(id).value.trim()||fb}function stars(){let n=Math.max(1,Math.min(3,Number(v('rating','2'))||2));return'★'.repeat(n)}function dt(){let d=$('date').value;if(!d)return'기록 예정';let x=new Date(d+'T00:00:00');return isNaN(x)?d:`${x.getFullYear()}.${String(x.getMonth()+1).padStart(2,'0')}.${String(x.getDate()).padStart(2,'0')}`}function safe(s){return String(s||'cre-eum').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,'-')}function read(f){return new Promise(r=>{let fr=new FileReader();fr.onload=()=>{let im=new Image();im.onload=()=>r({file:f,url:fr.result,img:im});im.src=fr.result};fr.readAsDataURL(f)})}
$('photos').onchange=async e=>{S.imgs=await Promise.all([...e.target.files].slice(0,4).map(read));S.sel=0;thumbs();make()};$('logo').onchange=async e=>{let f=e.target.files[0];if(!f)return;S.logo=await read(f);e.target.closest('label').querySelector('span').textContent='로고 적용됨';make()};$('mascot').onchange=async e=>{let f=e.target.files[0];if(!f)return;S.mascot=await read(f);e.target.closest('label').querySelector('span').textContent='해칭 포즈 적용됨';make()};function thumbs(){let t=$('thumbs');t.innerHTML='';S.imgs.forEach((a,i)=>{let im=new Image();im.src=a.url;im.alt=`${i+1}번 사진`;t.appendChild(im)})}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}function fill(x,y,w,h,r){rr(x,y,w,h,r);X.fill()}function stroke(x,y,w,h,r){rr(x,y,w,h,r);X.stroke()}function cover(im,x,y,w,h,r=24,fb='사진을 업로드해 주세요'){X.save();rr(x,y,w,h,r);X.clip();if(!im){X.fillStyle=P.mint2;X.fillRect(x,y,w,h);X.fillStyle=P.muted;X.font='800 28px Pretendard,sans-serif';X.textAlign='center';X.fillText(fb,x+w/2,y+h/2);X.restore();return}let sr=im.width/im.height,tr=w/h,sx=0,sy=0,sw=im.width,sh=im.height;if(sr>tr){sw=im.height*tr;sx=(im.width-sw)/2}else{sh=im.width/tr;sy=(im.height-sh)/2}X.drawImage(im,sx,sy,sw,sh,x,y,w,h);X.restore()}function contain(im,x,y,w,h){if(!im)return;let s=Math.min(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;X.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh)}function wrap(t,x,y,mw,lh,max=3){let units=String(t||'').split('\n').flatMap(p=>/\s/.test(p)?p.split(/(\s+)/).filter(Boolean):[...p]),lines=[],line='';units.forEach(u=>{let test=line+u;if(X.measureText(test).width>mw&&line){lines.push(line.trim());line=u.trimStart()}else line=test});if(line)lines.push(line.trim());lines=lines.slice(0,max);lines.forEach((l,i)=>X.fillText(l,x,y+i*lh));return y+lines.length*lh}function heart(cx,cy,s){let k=s/24;X.save();X.translate(cx,cy);X.scale(k,k);X.beginPath();X.moveTo(0,8);X.bezierCurveTo(-18,-4,-10,-20,0,-10);X.bezierCurveTo(10,-20,18,-4,0,8);X.closePath();X.fillStyle=P.coral;X.fill();X.lineWidth=3;X.strokeStyle=P.navy;X.stroke();X.restore()}function mark(x,y,s,t=th()){X.save();X.fillStyle=P.white;fill(x,y,s,s,20);X.strokeStyle='rgba(17,27,53,.14)';X.lineWidth=3;stroke(x,y,s,s,20);if(S.logo?.img){rr(x+8,y+8,s-16,s-16,16);X.clip();contain(S.logo.img,x+10,y+10,s-20,s-20);X.restore();return}X.fillStyle=P.navy;X.font=`900 ${Math.round(s*.5)}px Pretendard,sans-serif`;X.textAlign='center';X.textBaseline='middle';X.fillText('C',x+s/2,y+s/2+3);X.textBaseline='alphabetic';heart(x+s*.74,y+s*.27,s*.22);X.restore()}function mascot(x,y,size=126){if(S.mascot?.img){contain(S.mascot.img,x,y,size,size);return}let sc=size/230;X.save();X.translate(x-4,y-6);X.scale(sc,sc);X.lineCap='round';X.lineJoin='round';X.fillStyle=P.cream;X.strokeStyle=P.navy;X.lineWidth=9;X.beginPath();X.ellipse(166,138,68,88,-.18,0,Math.PI*2);X.fill();X.stroke();X.fillStyle='#FFF7DA';X.beginPath();X.ellipse(84,102,64,78,.08,0,Math.PI*2);X.fill();X.stroke();X.fillStyle=P.butter;for(let i=0;i<3;i++){X.beginPath();X.ellipse(35,58+i*29,18,24,-.35,0,Math.PI*2);X.fill();X.stroke()}X.fillStyle=P.navy;X.beginPath();X.arc(74,92,8,0,Math.PI*2);X.arc(116,92,8,0,Math.PI*2);X.fill();X.strokeStyle=P.navy;X.lineWidth=6;X.beginPath();X.arc(95,110,17,.25,Math.PI-.25);X.stroke();X.fillStyle=P.mint;X.globalAlpha=.82;X.beginPath();X.ellipse(86,158,24,36,0,0,Math.PI*2);X.fill();X.globalAlpha=1;X.restore()}function pill(text,right,y,fillc,color=P.navy){X.font='900 22px Pretendard,sans-serif';let w=X.measureText(text).width+34;X.fillStyle=fillc;fill(right-w,y,w,44,13);X.fillStyle=color;X.textAlign='left';X.fillText(text,right-w+17,y+30)}function bg(t){X.clearRect(0,0,C.width,C.height);X.fillStyle=P.paper;X.fillRect(0,0,C.width,C.height);X.fillStyle=t.soft;fill(0,0,C.width,148,0);X.fillStyle=t.primary;fill(0,0,18,148,0)}function topbar(t,label,i,total){mark(54,28,104,t);X.fillStyle=P.navy;X.font='900 38px Pretendard,sans-serif';X.textAlign='left';X.fillText(B.en,178,73);X.fillStyle=P.muted;X.font='800 22px Pretendard,sans-serif';X.fillText(`${B.ko} · ${B.tag}`,178,110);pill(`${i}/${total}`,1012,52,P.white);pill(label,908,52,t.primary,label.length>8?P.white:P.navy)}function foot(t){X.strokeStyle=t.accent;X.lineWidth=7;X.lineCap='round';X.beginPath();X.moveTo(70,1286);X.lineTo(196,1286);X.stroke();X.strokeStyle=t.primary;for(let i=0;i<3;i++){X.beginPath();X.moveTo(226+i*22,1297);X.lineTo(234+i*22,1274);X.stroke()}}function chip(l,v,x,y,w,t){X.fillStyle=P.white;fill(x,y,w,54,14);X.strokeStyle='rgba(17,27,53,.08)';X.lineWidth=2;stroke(x,y,w,54,14);X.fillStyle=t.accent;X.font='900 14px Pretendard,sans-serif';X.textAlign='left';X.fillText(l,x+15,y+22);X.fillStyle=P.navy;X.font='900 19px Pretendard,sans-serif';wrap(v,x+15,y+43,w-30,22,1)}function collage(imgs,x,y,w,h){let a=imgs.filter(Boolean),g=12;if(!a.length){cover(null,x,y,w,h,28);return}if(a.length===1){cover(a[0],x,y,w,h,28);return}if(a.length===2){let cw=(w-g)/2;cover(a[0],x,y,cw,h,28);cover(a[1],x+cw+g,y,cw,h,28);return}if(a.length===3){let lw=Math.round(w*.6),rw=w-lw-g,rh=(h-g)/2;cover(a[0],x,y,lw,h,28);cover(a[1],x+lw+g,y,rw,rh,28);cover(a[2],x+lw+g,y+rh+g,rw,rh,28);return}let cw=(w-g)/2,ch=(h-g)/2;a.slice(0,4).forEach((im,i)=>cover(im,x+(i%2)*(cw+g),y+Math.floor(i/2)*(ch+g),cw,ch,26))}
function content(){let t=th(),id=v('id','CRE-EUM PICK'),m=v('morph','크레스티드게코'),note=v('notes','개체의 패턴, 컨디션, 먹이반응을 확인하며 크레이음 기준에 맞춰 안내합니다.'),base={t,id,m,head:`${m} ${id}`,note,weight:v('weight','기록 중'),feed:v('feeding','안정적'),star:stars(),badge:t.badge,photo:'크레이음 픽'};if(type()==='hatching')return{...base,photo:'해칭 포인트 컷',head:'해칭 기록, 첫 번째 이음',note:note||`${m} 라인에서 만난 개체입니다.`};if(type()==='individual')return{...base,photo:'개체 포인트 컷',head:`${id} 개체 소개`,note:note||`${m} · ${base.star}. 실제 패턴과 컨디션을 함께 보고 안내합니다.`};if(type()==='care')return{...base,photo:'사육노트 컷',head:v('topic','사육환경 체크')};return{...base,photo:'릴스용 컷',head:'3초 안에 시선을 잡는 컷'}}function specs(){let ims=S.imgs.map(a=>a.img),photos=ims.length?ims:[null];return[{type:'info',images:photos},...photos.map((im,i)=>({type:'photo',image:im,label:`사진 ${i+1}`}))]}function draw(sp,c,i,total){sp.type==='info'?info(sp,c,i,total):photo(sp,c,i,total)}function info(sp,c,i,total){bg(c.t);topbar(c.t,c.badge,i+1,total);collage(sp.images,54,174,972,860);X.fillStyle='rgba(255,255,255,.94)';fill(54,1062,972,168,26);X.strokeStyle='rgba(17,27,53,.08)';X.lineWidth=2;stroke(54,1062,972,168,26);X.fillStyle=c.t.accent;fill(54,1062,12,168,6);mascot(82,1088,126);X.fillStyle=P.navy;X.font='900 32px Pretendard,sans-serif';X.textAlign='left';wrap(c.head,228,1112,740,38,1);X.fillStyle=P.muted;X.font='800 20px Pretendard,sans-serif';wrap(c.note,228,1150,740,28,2);[['추천',c.star],['ID',c.id],['모프',c.m],['체중',c.weight]].forEach((a,j)=>chip(a[0],a[1],228+j*190,1184,174,c.t));foot(c.t)}function photo(sp,c,i,total){bg(c.t);topbar(c.t,'PHOTO',i+1,total);cover(sp.image,54,172,972,1048,30);X.fillStyle='rgba(255,255,255,.9)';fill(78,1124,924,76,22);X.fillStyle=c.t.primary;fill(78,1124,10,76,5);X.fillStyle=P.navy;X.font='900 28px Pretendard,sans-serif';X.textAlign='left';wrap(c.photo,108,1172,430,32,1);X.fillStyle=P.muted;X.font='800 21px Pretendard,sans-serif';X.textAlign='right';X.fillText(`${c.star} · ${c.id}`,972,1172);foot(c.t)}function make(){let c
