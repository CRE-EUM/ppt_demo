<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>크레이음 인스타 스튜디오</title>
<style>
:root{--navy:#111b35;--mint:#55d8bd;--mint2:#e8fbf6;--coral:#ff6f7d;--cream:#fff3d1;--butter:#ffd65a;--line:#dde4ed;--muted:#617084;--page:#f7faf8;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}button,input,select,textarea{font:inherit}button{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy);min-height:40px;padding:0 14px;cursor:pointer;font-weight:800}.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.shell{display:grid;grid-template-columns:minmax(320px,390px) 1fr;min-height:100vh}.side{display:flex;flex-direction:column;gap:16px;padding:24px;background:#fff;border-right:1px solid var(--line);overflow:auto}.brand{display:flex;align-items:center;gap:14px}.mark{display:grid;place-items:center;width:54px;height:54px;border-radius:8px;background:var(--navy);color:#fff;font-size:28px;font-weight:900}.eyebrow{margin:0 0 4px;color:var(--coral);font-size:12px;font-weight:900}.brand h1,.work h2,h3{margin:0}.panel{display:grid;gap:14px;padding:16px;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 8px 22px rgba(17,27,53,.05)}.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.seg label{position:relative}.seg input{position:absolute;opacity:0}.seg span{display:grid;place-items:center;min-height:42px;border:1px solid var(--line);border-radius:8px;background:#f9fbfc;color:var(--muted);font-weight:900}.seg input:checked+span{background:var(--mint2);border-color:var(--navy);color:var(--navy)}label{display:grid;gap:7px;color:var(--muted);font-size:13px;font-weight:800}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy);padding:10px 11px;outline:none}textarea{resize:vertical}.drop{min-height:104px;align-content:center;justify-items:center;border:1px dashed #98ddcf;border-radius:8px;background:var(--mint2);text-align:center;cursor:pointer}.drop input{display:none}.drop span{font-weight:900}.drop small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.swatches span{height:34px;border-radius:8px;border:1px solid var(--line)}.navy{background:var(--navy)}.mint{background:var(--mint)}.coral{background:var(--coral)}.cream{background:var(--cream)}.butter{background:var(--butter)}.motifs{display:flex;flex-wrap:wrap;gap:7px}.motifs span{padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:900}.work{padding:24px;overflow:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.actions{display:flex;flex-wrap:wrap;gap:8px}.preview{display:grid;grid-template-columns:minmax(340px,560px) minmax(360px,1fr);gap:18px;align-items:start}.card,.copy{border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 18px 45px rgba(17,27,53,.12)}.card{padding:14px}canvas{display:block;width:100%;height:auto;border-radius:8px;background:var(--cream)}.copy{display:grid;gap:12px;padding:14px}.section{display:grid;gap:8px}.section-title{display:flex;align-items:center;justify-content:space-between}.section-title button{min-height:32px;font-size:13px}.section textarea{min-height:120px;line-height:1.55}.check{display:grid;gap:9px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--mint2)}.check label{grid-template-columns:18px 1fr;color:var(--navy);font-weight:650}.check input{width:auto;margin-top:2px}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.thumbs img{width:100%;aspect-ratio:1;border-radius:8px;object-fit:cover;border:1px solid var(--line)}@media(max-width:1050px){.shell,.preview{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}}@media(max-width:640px){.side,.work{padding:16px}.toolbar{align-items:stretch;flex-direction:column}.actions button{flex:1}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
<aside class="side">
<div class="brand"><div class="mark">C</div><div><p class="eyebrow">Creime Studio</p><h1>크레이음 인스타 스튜디오</h1></div></div>
<section class="panel"><h3>콘텐츠 유형</h3><div class="seg"><label><input type="radio" name="type" value="hatching" checked><span>해칭</span></label><label><input type="radio" name="type" value="individual"><span>개체</span></label><label><input type="radio" name="type" value="care"><span>사육정보</span></label><label><input type="radio" name="type" value="reels"><span>릴스</span></label></div></section>
<section class="panel"><h3>크레이음 색감</h3><div class="swatches"><span class="navy"></span><span class="mint"></span><span class="coral"></span><span class="cream"></span><span class="butter"></span></div><div class="motifs"><span>C꼬리</span><span>하트매듭</span><span>3칸 이음길</span></div></section>
<section class="panel"><h3>사진</h3><label class="drop" for="photos"><input id="photos" type="file" accept="image/*" multiple><span>개체/해칭 사진 업로드</span><small>첫 사진을 대표 이미지로 사용합니다.</small></label><div id="thumbs" class="thumbs"></div></section>
<section class="panel"><h3>개체정보</h3><div class="grid"><label>개체 ID<input id="geckoId" placeholder="예: CR-260519-01"></label><label>모프<input id="morph" placeholder="예: 논릴리 / 모자이크"></label><label>해칭일<input id="hatchDate" type="date"></label><label>체중<input id="weight" placeholder="예: 5.8g"></label><label>부 개체<input id="sire" placeholder="예: Sire name"></label><label>모 개체<input id="dam" placeholder="예: Dam name"></label><label>먹이반응<select id="feeding"><option>안정적</option><option>관찰 중</option><option>매우 적극적</option><option>개체별 안내 필요</option></select></label><label>상태<select id="status"><option>성장 관찰 중</option><option>분양 상담 가능</option><option>예약 중</option><option>분양 완료</option></select></label></div><label>개체 메모<textarea id="notes" rows="4" placeholder="성격, 패턴 포인트, 관리 메모를 적어주세요."></textarea></label><label>사육정보 주제<input id="careTopic" placeholder="예: 습도 관리, 유체 단독사육, 먹이반응"></label></section>
</aside>
<section class="work"><header class="toolbar"><div><p class="eyebrow">Preview</p><h2>인스타 업로드 초안</h2></div><div class="actions"><button id="make" class="primary">자동 제작</button><button id="png">PNG 저장</button><button id="csv">Canva CSV</button></div></header><div class="preview"><section class="card"><canvas id="canvas" width="1080" height="1350"></canvas></section><section class="copy"><div class="section"><div class="section-title"><h3>캡션</h3><button data-copy="caption">복사</button></div><textarea id="caption"></textarea></div><div class="section"><div class="section-title"><h3>카드 문구</h3><button data-copy="slides">복사</button></div><textarea id="slides"></textarea></div><div class="section"><div class="section-title"><h3>릴스 구성</h3><button data-copy="reels">복사</button></div><textarea id="reels"></textarea></div><div class="check"><h3>업로드 전 확인</h3><label><input type="checkbox"> 개체 ID, 부모 정보, 해칭일 확인</label><label><input type="checkbox"> 건강/먹이반응 표현 과장 없음</label><label><input type="checkbox"> 분양 문구가 과도한 구매 유도처럼 보이지 않음</label><label><input type="checkbox"> 사육정보 기준 확인</label></div></section></div></section>
</main>
<script>
const $=id=>document.getElementById(id),ctx=$('canvas').getContext('2d');let imgs=[];const P={navy:'#111B35',mint:'#55D8BD',mint2:'#E8FBF6',coral:'#FF6F7D',cream:'#FFF3D1',butter:'#FFD65A',butter2:'#FFF8D8',white:'#FFFFFF',line:'#DDE4ED',muted:'#617084'};const T={hatching:{p:'해칭노트',b:'HATCHING NOTE',c:P.butter,a:P.coral,s:P.butter2,m:'알 + 3칸 이음길',h:'#해칭노트'},individual:{p:'이음매칭',b:'MATCHING',c:P.coral,a:P.mint,s:'#FFF0F2',m:'C꼬리 + 하트매듭',h:'#이음매칭'},care:{p:'사육노트',b:'CARE NOTE',c:P.mint,a:P.coral,s:P.mint2,m:'민트 체크 + C라인',h:'#사육노트'},reels:{p:'릴스훅',b:'REELS HOOK',c:P.navy,a:P.coral,s:'#F2F6FF',m:'3초 훅 + 하트매듭',h:'#크레릴스'}};function type(){return document.querySelector('input[name=type]:checked').value}function th(){return T[type()]}function val(id,f=''){return $(id).value.trim()||f}function date(v){if(!v)return'해칭일 기록 예정';let d=new Date(v+'T00:00:00');return isNaN(d)?v:`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`}function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}function fillR(x,y,w,h,r,c){ctx.fillStyle=c;rr(x,y,w,h,r);ctx.fill()}function imgCover(im,x,y,w,h){if(!im){fillR(x,y,w,h,28,P.mint2);ctx.fillStyle=P.muted;ctx.font='700 30px sans-serif';ctx.textAlign='center';ctx.fillText('사진을 업로드해 주세요',x+w/2,y+h/2);return}let sr=im.width/im.height,tr=w/h,sx=0,sy=0,sw=im.width,sh=im.height;if(sr>tr){sw=im.height*tr;sx=(im.width-sw)/2}else{sh=im.width/tr;sy=(im.height-sh)/2}ctx.save();rr(x,y,w,h,28);ctx.clip();ctx.drawImage(im,sx,sy,sw,sh,x,y,w,h);ctx.restore()}function wrap(t,x,y,w,lh,n=8){let words=String(t).split(' '),line='',c=0;for(let word of words){let test=line?line+' '+word:word;if(ctx.measureText(test).width>w&&line){ctx.fillText(line,x,y);line=word;y+=lh;if(++c>=n)return}else line=test}if(line)ctx.fillText(line,x,y)}function heart(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s/24,s/24);ctx.beginPath();ctx.moveTo(0,8);ctx.bezierCurveTo(-18,-4,-10,-20,0,-10);ctx.bezierCurveTo(10,-20,18,-4,0,8);ctx.closePath();ctx.fillStyle=P.coral;ctx.fill();ctx.lineWidth=3.4;ctx.strokeStyle=P.navy;ctx.stroke();ctx.restore()}function mascot(x,y,sc,theme){ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.strokeStyle=P.navy;ctx.lineWidth=12;ctx.lineCap='round';ctx.beginPath();ctx.arc(82,82,66,Math.PI*.68,Math.PI*1.9);ctx.stroke();ctx.strokeStyle=theme.c;ctx.lineWidth=7;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(48+i*23,145);ctx.lineTo(56+i*23,117);ctx.stroke()}fillR(38,66,54,58,26,P.cream);ctx.strokeStyle=P.navy;ctx.lineWidth=6;ctx.stroke();ctx.fillStyle=P.butter;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(39,75+i*15,8,0,Math.PI*2);ctx.fill();ctx.stroke()}ctx.fillStyle=P.navy;ctx.beginPath();ctx.arc(69,87,5,0,Math.PI*2);ctx.fill();ctx.lineWidth=4;ctx.beginPath();ctx.arc(83,96,8,.25,1.4);ctx.stroke();ctx.fillStyle=P.mint;ctx.globalAlpha=.85;ctx.beginPath();ctx.ellipse(54,118,11,18,.2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;heart(139,51,26);ctx.restore()}function content(){let theme=th(),id=val('geckoId','CREIME PICK'),m=val('morph','크레스티드게코'),hd=date($('hatchDate').value),wt=val('weight','기록 중'),feed=val('feeding','안정적'),st=val('status','성장 관찰 중'),note=val('notes','패턴과 컨디션을 관찰하며 크레이음 기준에 맞춰 관리 중입니다.'),sire=val('sire','부 개체 기록'),dam=val('dam','모 개체 기록'),topic=val('careTopic','초보자를 위한 사육환경 체크');if(type()==='hatching')return{badge:theme.b,title:'새로운 해칭 소식',overlay:`${m} 라인에서 만난 작은 시작`,sub:`부 ${sire} × 모 ${dam}`,info:'해칭노트',body:`${id} / ${hd} / 먹이반응 ${feed}`};if(type()==='individual')return{badge:theme.b,title:`${id} 개체 소개`,overlay:`${m} · ${st}`,sub:`체중 ${wt} / 먹이반응 ${feed}`,info:'이음매칭 메모',body:note};if(type()==='care')return{badge:theme.b,title:topic,overlay:'사육은 예쁨보다 안정이 먼저입니다',sub:'크레이음 사육노트',info:'오늘의 핵심',body:note};return{badge:theme.b,title:'3초 안에 시선 잡는 크레 릴스',overlay:`${m}의 포인트를 짧고 선명하게`,sub:'훅 → 디테일 → 저장 유도',info:'릴스 포맷',body:note}}function draw(){let c=content(),theme=th();ctx.clearRect(0,0,1080,1350);ctx.fillStyle=P.white;ctx.fillRect(0,0,1080,1350);ctx.strokeStyle=P.line;ctx.lineWidth=6;ctx.beginPath();ctx.arc(540,675,548,0,Math.PI*2);ctx.stroke();fillR(52,52,976,226,34,theme.s);fillR(52,52,18,226,9,theme.c);mascot(808,68,.88,theme);ctx.fillStyle=P.navy;ctx.font='900 50px sans-serif';ctx.textAlign='left';ctx.fillText('크레이음',74,92);ctx.fillStyle=P.muted;ctx.font='800 24px sans-serif';ctx.fillText('단 하나의 크레를 이어주는 맞춤분양 스튜디오',74,134);ctx.fillStyle=P.navy;ctx.font='900 24px sans-serif';ctx.fillText(theme.p,74,202);ctx.fillStyle=theme.a;ctx.beginPath();ctx.arc(196,194,8,0,Math.PI*2);ctx.fill();ctx.font='800 28px sans-serif';let bw=ctx.measureText(c.badge).width+42;fillR(74,300,bw,52,12,theme.c);ctx.fillStyle=theme.c===P.butter?P.navy:P.white;ctx.fillText(c.badge,95,335);ctx.fillStyle=P.navy;ctx.font='900 58px sans-serif';wrap(c.title,74,420,870,68,2);imgCover(imgs[0]?.image,74,520,932,500);fillR(104,918,872,142,22,P.white);fillR(104,918,16,142,8,theme.a);ctx.fillStyle=P.navy;ctx.font='900 34px sans-serif';wrap(c.overlay,142,972,805,44,2);ctx.fillStyle=P.muted;ctx.font='800 23px sans-serif';wrap(c.sub,142,1023,805,34,1);fillR(74,1100,932,150,22,P.white);ctx.fillStyle=P.navy;ctx.font='900 28px sans-serif';ctx.fillText(c.info,108,1154);ctx.font='700 28px sans-serif';wrap(c.body,108,1198,860,36,2);ctx.strokeStyle=theme.c;ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(74,1280);ctx.lineTo(322,1280);ctx.stroke();ctx.strokeStyle=theme.a;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(358+i*26,1296);ctx.lineTo(368+i*26,1270);ctx.stroke()}ctx.fillStyle=P.muted;ctx.font='700 22px sans-serif';ctx.fillText(`@creime_official | ${theme.p} | 맞춤분양 상담은 프로필 링크`,74,1320)}function caption(){let theme=th(),id=val('geckoId','CREIME PICK'),m=val('morph','크레스티드게코'),hd=date($('hatchDate').value),wt=val('weight','기록 중'),feed=val('feeding','안정적'),st=val('status','성장 관찰 중'),note=val('notes','크레이음 기준에 맞춰 컨디션과 먹이반응을 차분히 확인하고 있습니다.');let tags=`#크레이음 #이음꼬리 ${theme.h} #크레스티드게코 #크레 #크레분양 #올바른사육`;if(type()==='care')return`[${theme.p}]\n${val('careTopic','사육환경 체크')}\n\n크레스티드게코 사육은 온도·습도·환기·은신처·먹이반응을 함께 보는 것이 중요합니다.\n\n${note}\n\n저장해두고 다시 확인해보세요.\n\n${tags}`;return`[${theme.p}]\n${id} 기록\n\n모프: ${m}\n해칭일: ${hd}\n체중: ${wt}\n먹이반응: ${feed}\n상태: ${st}\n\n${note}\n\n크레이음은 단 하나의 크레를 찾는 과정까지 함께 봅니다.\n\n${tags}`}function text(){let theme=th();$('caption').value=caption();$('slides').value=`1장: ${theme.p}\n2장: 개체/주제 핵심\n3장: 상태와 관찰 포인트\n4장: 3칸 이음길\n5장: 맞춤상담 CTA`;$('reels').value=`릴스 대본\n콘셉트: ${theme.p} / ${theme.m}\n0-2초: 가장 선명한 포인트\n3-6초: 디테일 클로즈업\n7-11초: 움직임 또는 사육 포인트\n12-15초: 크레이음 맞춤상담 CTA`}function make(){draw();text()}$('photos').onchange=async e=>{imgs=[];$('thumbs').innerHTML='';for(let f of [...e.target.files]){let url=URL.createObjectURL(f),im=new Image();await new Promise(r=>{im.onload=r;im.src=url});imgs.push({file:f,image:im,url});let t=new Image();t.src=url;$('thumbs').appendChild(t)}make()};document.querySelectorAll('input,select,textarea').forEach(el=>{if(el.type!=='file')el.addEventListener('input',make)});document.querySelectorAll('input[name=type]').forEach(el=>el.addEventListener('change',make));$('make').onclick=make;$('png').onclick=()=>{let a=document.createElement('a');a.download=(val('geckoId','creime-post')+'-instagram.png').replace(/[^\w가-힣.-]+/g,'-');a.href=$('canvas').toDataURL('image/png');a.click()};$('csv').onclick=()=>{let blob=new Blob(['\ufeff'+$('caption').value],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.download='creime-canva.csv';a.href=URL.createObjectURL(blob);a.click();URL.revokeObjectURL(a.href)};document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText($(b.dataset.copy).value));make();
</script>
</body>
</html>
