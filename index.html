<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크레이음 인스타 스튜디오</title>
<style>
:root{--navy:#111b35;--mint:#55d8bd;--soft:#f7f4ee;--line:#dde4ed;--coral:#ff6f7d;--cream:#fff3d1;--text:#172033}
*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--text);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}
button,input,select,textarea{font:inherit}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy);font-weight:800;padding:0 13px;cursor:pointer}.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.wrap{display:grid;grid-template-columns:minmax(310px,390px) 1fr;min-height:100vh}.side{display:grid;align-content:start;gap:14px;padding:22px;background:#fff;border-right:1px solid var(--line);overflow:auto}
.brand{display:flex;gap:12px;align-items:center}.brand img{width:54px;height:54px;object-fit:contain}.brand p{margin:0;color:var(--coral);font-size:12px;font-weight:900}.brand h1{margin:2px 0 0;font-size:22px}
.panel{display:grid;gap:12px;border:1px solid var(--line);border-radius:8px;padding:15px;background:#fff;box-shadow:0 8px 20px rgba(17,27,53,.05)}h2,h3{margin:0}h2{font-size:18px}h3{font-size:15px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.seg label{position:relative}.seg input{position:absolute;opacity:0}.seg span{display:grid;place-items:center;min-height:42px;border:1px solid var(--line);border-radius:8px;background:#fafbfc;font-weight:900;color:#617084}.seg input:checked+span{border-color:var(--navy);background:#e8fbf6;color:var(--navy)}
label{display:grid;gap:7px;color:#617084;font-size:13px;font-weight:750}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--navy)}textarea{resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.drop{min-height:96px;border:1px dashed #8ed8ca;border-radius:8px;background:#e8fbf6;place-items:center;text-align:center;cursor:pointer}.drop input{display:none}.drop b{color:var(--navy)}.drop small{display:block;margin-top:4px;color:#617084}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.work{padding:22px;overflow:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.preview{display:grid;grid-template-columns:minmax(330px,570px) minmax(320px,1fr);gap:18px;align-items:start}.card,.copy{border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 18px 45px rgba(17,27,53,.12);padding:14px}
canvas{display:block;width:100%;height:auto;border-radius:8px;background:var(--cream)}.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.slide{padding:0;border-radius:8px;overflow:hidden}.slide img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}.slide span{display:block;padding:7px;font-size:11px;color:#617084}.on{outline:3px solid rgba(85,216,189,.42)}
.copy{display:grid;gap:12px}.copy textarea{min-height:132px;line-height:1.55}.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.sw i{height:30px;border-radius:8px;border:1px solid var(--line)}@media(max-width:1050px){.wrap,.preview{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}}@media(max-width:640px){.side,.work{padding:15px}.bar{display:grid}.grid{grid-template-columns:1fr}.strip{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main class="wrap">
<aside class="side">
  <div class="brand"><img src="assets/cre-eum-logo.png" alt="크레이음 로고"><div><p>CRE-EUM Studio</p><h1>크레이음 인스타 스튜디오</h1></div></div>
  <section class="panel"><h2>콘텐츠 유형</h2><div class="seg">
    <label><input type="radio" name="type" value="hatching" checked><span>해칭</span></label>
    <label><input type="radio" name="type" value="individual"><span>개체</span></label>
    <label><input type="radio" name="type" value="care"><span>사육정보</span></label>
    <label><input type="radio" name="type" value="reels"><span>릴스</span></label>
  </div></section>
  <section class="panel"><h2>브랜드 색감</h2><div class="sw"><i style="background:#111b35"></i><i style="background:#55d8bd"></i><i style="background:#ff6f7d"></i><i style="background:#fff3d1"></i><i style="background:#ffd65a"></i></div></section>
  <section class="panel"><h2>사진</h2><label class="drop" for="photos"><input id="photos" type="file" accept="image/*" multiple><b>개체 사진 2~4장 업로드</b><small>첫 장은 여러 컷, 뒤 장은 큰 사진 한 장씩</small></label><div id="thumbs" class="thumbs"></div></section>
  <section class="panel"><h2>개체정보</h2><div class="grid">
    <label>개체 ID<input id="id" placeholder="예: CR-260520-01"></label><label>모프<input id="morph" placeholder="예: 논릴리 / 모자이크"></label>
    <label>해칭일<input id="date" type="date"></label><label>체중<input id="weight" placeholder="예: 5.8g"></label>
    <label>부 개체<input id="sire" placeholder="Sire"></label><label>모 개체<input id="dam" placeholder="Dam"></label>
    <label>먹이반응<select id="feeding"><option>안정적</option><option>관찰 중</option><option>매우 적극적</option><option>개체별 안내 필요</option></select></label>
    <label>추천등급<select id="rating"><option value="1">★ 추천</option><option value="2" selected>★★ 추천</option><option value="3">★★★ 추천</option></select></label>
  </div><label>개체 메모<textarea id="notes" rows="4" placeholder="사진에 함께 들어갈 짧은 설명을 적어주세요."></textarea></label><label>사육정보 주제<input id="topic" placeholder="예: 온도 관리, 유체 단독사육"></label></section>
</aside>
<section class="work">
  <header class="bar"><div><p style="margin:0;color:#ff6f7d;font-weight:900;font-size:12px">Preview</p><h2>인스타 캐러셀 초안</h2></div><div class="actions"><button id="make" class="primary">자동 제작</button><button id="png">현재 PNG</button><button id="all">전체 PNG</button><button id="csv">Canva CSV</button></div></header>
  <div class="preview"><section class="card"><canvas id="canvas" width="1080" height="1350"></canvas><div id="strip" class="strip"></div></section><section class="copy"><h3>캡션</h3><textarea id="caption"></textarea><h3>카드 문구</h3><textarea id="slides"></textarea><h3>릴스 구성</h3><textarea id="reels"></textarea></section></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id),C=$("canvas"),x=C.getContext("2d"),P={navy:"#111B35",mint:"#55D8BD",coral:"#FF6F7D",cream:"#FFF3D1",paper:"#FFFCF7",line:"#DDE4ED",muted:"#617084",white:"#fff",butter:"#FFD65A"},S={imgs:[],sel:0,urls:[],specs:[]},brand={ko:"크레이음",en:"CRE-EUM",tag:"단 하나의 크레"};
const logo=new Image(),mascot=new Image();logo.src="assets/cre-eum-logo.png";mascot.src="assets/cre-eum-hatching-pose.png";logo.onload=mascot.onload=()=>make();
const T={hatching:{name:"해칭노트",badge:"HATCHING",main:P.butter,soft:"#FFF8D8",tag:"#해칭노트"},individual:{name:"이음매칭",badge:"MATCHING",main:P.coral,soft:"#FFF0F2",tag:"#이음매칭"},care:{name:"사육노트",badge:"CARE",main:P.mint,soft:"#E8FBF6",tag:"#사육노트"},reels:{name:"릴스훅",badge:"REELS",main:P.navy,soft:"#F3F6FF",tag:"#크레릴스"}};
function type(){return document.querySelector("[name=type]:checked").value}function th(){return T[type()]}function v(id,f=""){return $(id).value.trim()||f}function stars(){return "★".repeat(Math.max(1,Math.min(3,+v("rating","2")||2)))}function safe(s){return String(s||"cre-eum").replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g,"-")}
function read(file){return new Promise(r=>{let fr=new FileReader();fr.onload=()=>{let im=new Image();im.onload=()=>r({file,url:fr.result,img:im});im.src=fr.result};fr.readAsDataURL(file)})}
$("photos").onchange=async e=>{S.imgs=await Promise.all([...e.target.files].slice(0,4).map(read));S.sel=0;thumbs();make()};document.querySelectorAll("input,select,textarea").forEach(e=>{if(e.type==="file")return;e.oninput=make;e.onchange=make});document.querySelectorAll("[name=type]").forEach(e=>e.onchange=()=>{S.sel=0;make()});
function thumbs(){let t=$("thumbs");t.innerHTML="";S.imgs.forEach(a=>{let im=new Image();im.src=a.url;t.appendChild(im)})}
function rr(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}function fill(a,b,w,h,r){rr(a,b,w,h,r);x.fill()}function stroke(a,b,w,h,r){rr(a,b,w,h,r);x.stroke()}
function contain(im,a,b,w,h){if(!im.complete)return;let s=Math.min(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;x.drawImage(im,a+(w-dw)/2,b+(h-dh)/2,dw,dh)}function cover(im,a,b,w,h,r=26){x.save();rr(a,b,w,h,r);x.clip();if(!im){x.fillStyle="#E8FBF6";x.fillRect(a,b,w,h);x.fillStyle=P.muted;x.font="800 28px sans-serif";x.textAlign="center";x.fillText("사진을 업로드해 주세요",a+w/2,b+h/2);x.restore();return}let sr=im.width/im.height,tr=w/h,sx=0,sy=0,sw=im.width,sh=im.height;if(sr>tr){sw=im.height*tr;sx=(im.width-sw)/2}else{sh=im.width/tr;sy=(im.height-sh)/2}x.drawImage(im,sx,sy,sw,sh,a,b,w,h);x.restore()}
function wrap(t,a,b,mw,lh,max=2){let units=String(t||"").split("\n").flatMap(p=>/\s/.test(p)?p.split(/(\s+)/).filter(Boolean):[...p]),line="",lines=[];for(let u of units){let test=line+u;if(x.measureText(test).width>mw&&line){lines.push(line.trim());line=u.trimStart()}else line=test}if(line)lines.push(line.trim());lines.slice(0,max).forEach((l,i)=>x.fillText(l,a,b+i*lh))}
function bg(t){x.clearRect(0,0,1080,1350);x.fillStyle=P.paper;x.fillRect(0,0,1080,1350);x.fillStyle=t.soft;fill(0,0,1080,148,0);x.fillStyle=t.main;fill(0,0,18,148,0)}
function top(t,label,i,n){contain(logo,38,10,132,132);x.fillStyle=P.navy;x.font="900 38px sans-serif";x.textAlign="left";x.fillText(brand.en,194,73);x.fillStyle=P.muted;x.font="800 22px sans-serif";x.fillText(`${brand.ko} · ${brand.tag}`,194,110);pill(`${i}/${n}`,1012,52,P.white);pill(label,908,52,t.main,label.length>8?P.white:P.navy)}
function pill(txt,right,y,bg,c=P.navy){x.font="900 22px sans-serif";let w=x.measureText(txt).width+34;x.fillStyle=bg;fill(right-w,y,w,44,13);x.fillStyle=c;x.textAlign="left";x.fillText(txt,right-w+17,y+30)}
function chip(l,val,a,b,w,t){x.fillStyle=P.white;fill(a,b,w,54,14);x.strokeStyle="rgba(17,27,53,.08)";x.lineWidth=2;stroke(a,b,w,54,14);x.fillStyle=t.main;x.font="900 14px sans-serif";x.textAlign="left";x.fillText(l,a+15,b+22);x.fillStyle=P.navy;x.font="900 19px sans-serif";wrap(val,a+15,b+43,w-30,22,1)}
function foot(t){x.strokeStyle=t.main;x.lineWidth=7;x.lineCap="round";x.beginPath();x.moveTo(70,1286);x.lineTo(196,1286);x.stroke();x.fillStyle=P.muted;x.font="900 24px sans-serif";x.textAlign="right";x.fillText("@creeum",1010,1295)}
function collage(imgs,a,b,w,h){let ar=imgs.filter(Boolean),g=12;if(!ar.length)return cover(null,a,b,w,h);if(ar.length===1)return cover(ar[0],a,b,w,h);if(ar.length===2){let cw=(w-g)/2;cover(ar[0],a,b,cw,h);cover(ar[1],a+cw+g,b,cw,h);return}if(ar.length===3){let lw=w*.6,rw=w-lw-g,rh=(h-g)/2;cover(ar[0],a,b,lw,h);cover(ar[1],a+lw+g,b,rw,rh);cover(ar[2],a+lw+g,b+rh+g,rw,rh);return}let cw=(w-g)/2,ch=(h-g)/2;ar.slice(0,4).forEach((im,i)=>cover(im,a+(i%2)*(cw+g),b+Math.floor(i/2)*(ch+g),cw,ch))}
function content(){let t=th(),id=v("id","CRE-EUM PICK"),m=v("morph","크레스티드게코"),note=v("notes","개체의 패턴, 컨디션, 먹이반응을 확인하며 크레이음 기준에 맞춰 안내합니다.");return{t,id,m,note,star:stars(),feed:v("feeding","안정적"),weight:v("weight","기록 중"),head:type()==="hatching"?"해칭 기록, 첫 번째 이음":type()==="care"?v("topic","사육환경 체크"):type()==="reels"?"3초 안에 시선을 잡는 컷":`${id} 개체 소개`,photo:type()==="hatching"?"해칭 포인트 컷":type()==="care"?"사육노트 컷":type()==="reels"?"릴스용 컷":"개체 포인트 컷"}}
function specs(){let ims=S.imgs.map(a=>a.img),p=ims.length?ims:[null];return[{kind:"info",images:p},...p.map(im=>({kind:"photo",image:im}))]}
function draw(sp,c,i,n){sp.kind==="info"?info(sp,c,i,n):photo(sp,c,i,n)}
function info(sp,c,i,n){bg(c.t);top(c.t,c.t.badge,i+1,n);collage(sp.images,54,174,972,860);x.fillStyle="rgba(255,255,255,.94)";fill(54,1062,972,168,26);x.fillStyle=c.t.main;fill(54,1062,12,168,6);contain(mascot,82,1088,126,126);x.fillStyle=P.navy;x.font="900 32px sans-serif";x.textAlign="left";wrap(c.head,228,1112,740,38,1);x.fillStyle=P.muted;x.font="800 20px sans-serif";wrap(c.note,228,1150,740,28,2);[["추천",c.star],["ID",c.id],["모프",c.m],["체중",c.weight]].forEach((a,j)=>chip(a[0],a[1],228+j*190,1184,174,c.t));foot(c.t)}
function photo(sp,c,i,n){bg(c.t);top(c.t,"PHOTO",i+1,n);cover(sp.image,54,172,972,1048,30);x.fillStyle="rgba(255,255,255,.9)";fill(78,1124,924,76,22);x.fillStyle=c.t.main;fill(78,1124,10,76,5);x.fillStyle=P.navy;x.font="900 28px sans-serif";x.textAlign="left";wrap(c.photo,108,1172,430,32,1);x.fillStyle=P.muted;x.font="800 21px sans-serif";x.textAlign="right";x.fillText(`${c.star} · ${c.id}`,972,1172);foot(c.t)}
function make(){let c=content(),sp=specs();S.specs=sp;if(S.sel>=sp.length)S.sel=0;S.urls=sp.map((s,i)=>{draw(s,c,i,sp.length);return C.toDataURL("image/png")});draw(sp[S.sel],c,S.sel,sp.length);render();text(c,sp)}
function render(){let r=$("strip");r.innerHTML="";S.urls.forEach((u,i)=>{let b=document.createElement("button");b.className="slide"+(i===S.sel?" on":"");let im=new Image();im.src=u;let s=document.createElement("span");s.textContent=i?`${i+1} 큰 사진`:"1 대표 콜라주";b.append(im,s);b.onclick=()=>{S.sel=i;draw(S.specs[i],content(),i,S.specs.length);render()};r.appendChild(b)})}
function text(c,sp){let tags=`#크레이음 #CREEUM ${c.t.tag} #크레스티드게코 #크레분양 #올바른사육정보 #논릴리 #모자이크`;$("caption").value=`[${c.t.name}]\n${c.id} ${c.m}\n\n추천등급: ${c.star}\n먹이반응: ${c.feed}\n\n${c.note}\n\n단 하나의 크레를 이어주는 것이 크레이음의 기준입니다.\n\n${tags}`;$("slides").value=sp.map((s,i)=>i?`${i+1}장: 사진 한 장을 크게 보여주는 컷`:`${i+1}장: 여러 컷 대표 콜라주 + 작은 설명`).join("\n");$("reels").value=`릴스 대본\n0-2초: 얼굴 또는 패턴 클로즈업\n3-5초: ${c.m} 포인트 컷\n6-9초: 손 위 움직임 또는 먹이반응\n10-13초: 전체 체형 컷\n14-16초: 단 하나의 크레, 크레이음에서 이음`}
function down(url,name){let a=document.createElement("a");a.href=url;a.download=name;a.click()}$("make").onclick=make;$("png").onclick=()=>down(C.toDataURL("image/png"),`${safe(v("id","cre-eum"))}-card-${S.sel+1}.png`);$("all").onclick=()=>{make();S.urls.forEach((u,i)=>setTimeout(()=>down(u,`${safe(v("id","cre-eum"))}-card-${i+1}.png`),i*220))};$("csv").onclick=()=>{let rows=[["Slide","Type","Brand","Title","Rating"],...S.specs.map((s,i)=>[i+1,s.kind,brand.en,i?"Photo":"Info",stars()])],csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n"),blob=new Blob(["\ufeff"+csv],{type:"text/csv"}),url=URL.createObjectURL(blob);down(url,`${safe(v("id","cre-eum"))}-canva.csv`);URL.revokeObjectURL(url)}
make();
</script>
</body>
</html>
