<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>크레이음 인스타 스튜디오</title>
<style>
:root{--navy:#111b35;--mint:#55d8bd;--coral:#ff6f7d;--cream:#fff3d1;--butter:#ffd65a;--paper:#f7f4ee;--line:#dde4ed;--muted:#617084;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}button,input,select,textarea{font:inherit}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy);font-weight:850;padding:0 13px;cursor:pointer}.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.wrap{display:grid;grid-template-columns:minmax(320px,400px) 1fr;min-height:100vh}.side{display:grid;align-content:start;gap:14px;padding:22px;background:#fff;border-right:1px solid var(--line)}.brand{display:flex;gap:12px;align-items:center}.brand img{width:82px;height:82px;object-fit:contain}.brand p{margin:0;color:var(--coral);font-size:12px;font-weight:900;text-transform:uppercase}.brand h1{margin:2px 0 0;font-size:22px}.panel{display:grid;gap:12px;border:1px solid var(--line);border-radius:8px;padding:15px;background:#fff;box-shadow:0 8px 20px rgba(17,27,53,.05)}h2,h3{margin:0}h2{font-size:18px}h3{font-size:15px}.seg,.grid,.parents{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.seg label{position:relative}.seg input{position:absolute;opacity:0}.seg span{display:grid;place-items:center;min-height:42px;border:1px solid var(--line);border-radius:8px;background:#fafbfc;font-weight:900;color:var(--muted)}.seg input:checked+span{border-color:var(--navy);background:#e8fbf6;color:var(--navy)}label{display:grid;gap:7px;color:var(--muted);font-size:13px;font-weight:750}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--navy)}textarea{resize:vertical}.drop{min-height:98px;border:1px dashed #8ed8ca;border-radius:8px;background:#e8fbf6;place-items:center;text-align:center;cursor:pointer}.drop input,.small-drop input{display:none}.drop b,.small-drop b{color:var(--navy)}.drop small{display:block;margin-top:4px;color:var(--muted)}.small-drop{min-height:58px;border:1px dashed #8ed8ca;border-radius:8px;background:#fafbfc;place-items:center;text-align:center;cursor:pointer}.small-drop.done{border-style:solid;border-color:var(--mint);background:#e8fbf6}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.sw i{height:30px;border-radius:8px;border:1px solid var(--line)}.work{padding:22px;overflow:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.preview{display:grid;grid-template-columns:minmax(330px,570px) minmax(320px,1fr);gap:18px;align-items:start}.card,.copy{border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 18px 45px rgba(17,27,53,.12);padding:14px}canvas{display:block;width:100%;height:auto;border-radius:8px;background:var(--cream)}.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.slide{padding:0;border-radius:8px;overflow:hidden}.slide img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}.slide span{display:block;padding:7px;font-size:11px;color:var(--muted)}.on{outline:3px solid rgba(85,216,189,.42)}.copy{display:grid;gap:12px}.copy textarea{min-height:132px;line-height:1.55}@media(max-width:1050px){.wrap,.preview{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}}@media(max-width:640px){.side,.work{padding:15px}.bar{display:grid}.grid,.parents{grid-template-columns:1fr}.strip{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main class="wrap">
<aside class="side">
<div class="brand"><img id="brandLogo" alt="크레이음 로고"><div><p>CRE-EUM Studio</p><h1>크레이음 인스타 스튜디오</h1></div></div>
<section class="panel"><h2>콘텐츠 유형</h2><div class="seg"><label><input type="radio" name="type" value="hatching" checked><span>해칭</span></label><label><input type="radio" name="type" value="individual"><span>개체</span></label><label><input type="radio" name="type" value="care"><span>사육정보</span></label><label><input type="radio" name="type" value="reels"><span>릴스</span></label></div></section>
<section class="panel"><h2>브랜드 색감</h2><div class="sw"><i style="background:#111b35"></i><i style="background:#55d8bd"></i><i style="background:#ff6f7d"></i><i style="background:#fff3d1"></i><i style="background:#ffd65a"></i></div></section>
<section class="panel"><h2>사진</h2><label class="drop" for="photos"><input id="photos" type="file" accept="image/*" multiple><b>개체 사진 2~4장 업로드</b><small>첫 장은 여러 컷, 뒤 장은 사진 한 장씩 크게 제작됩니다.</small></label><div id="thumbs" class="thumbs"></div><div class="parents"><label class="small-drop" for="sirePhoto"><input id="sirePhoto" type="file" accept="image/*"><b>부 개체 사진</b></label><label class="small-drop" for="damPhoto"><input id="damPhoto" type="file" accept="image/*"><b>모 개체 사진</b></label></div></section>
<section class="panel"><h2>개체정보</h2><div class="grid"><label>개체 ID<input id="id" placeholder="예: CR-260520-01"></label><label>모프<input id="morph" placeholder="예: 논릴리 / 모자이크"></label><label>해칭일<input id="date" type="date"></label><label>체중<input id="weight" placeholder="예: 5.8g"></label><label>부 개체<input id="sire" placeholder="Sire"></label><label>모 개체<input id="dam" placeholder="Dam"></label><label>먹이반응<select id="feeding"><option>안정적</option><option>관찰 중</option><option>매우 적극적</option><option>개체별 안내 필요</option></select></label><label>추천등급<select id="rating"><option value="1">★ 추천</option><option value="2" selected>★★ 추천</option><option value="3">★★★ 추천</option></select></label></div><label>개체 메모<textarea id="notes" rows="4" placeholder="사진과 함께 들어갈 짧은 설명을 적어주세요."></textarea></label><label>사육정보 주제<input id="topic" placeholder="예: 온도 관리, 유체 단독사육"></label></section>
</aside>
<section class="work"><header class="bar"><div><p style="margin:0;color:#ff6f7d;font-weight:900;font-size:12px">Preview</p><h2>인스타 캐러셀 초안</h2></div><div class="actions"><button id="make" class="primary">자동 제작</button><button id="png">현재 PNG</button><button id="all">전체 PNG</button><button id="csv">Canva CSV</button></div></header><div class="preview"><section class="card"><canvas id="cv" width="1080" height="1350"></canvas><div id="strip" class="strip"></div></section><section class="copy"><h3>캡션</h3><textarea id="caption"></textarea><h3>카드 문구</h3><textarea id="slides"></textarea><h3>릴스 구성</h3><textarea id="reels"></textarea></section></div></section>
</main>

function wrap(txt,x,y,mw,lh,max=2){const arr=String(txt||"").split("\n").flatMap(p=>/\s/.test(p)?p.split(/(\s+)/).filter(Boolean):[...p]);let line="",lines=[];for(const u of arr){const test=line+u;if(g.measureText(test).width>mw&&line){lines.push(line.trim());line=u.trimStart()}else line=test}if(line)lines.push(line.trim());lines.slice(0,max).forEach((l,i)=>g.fillText(l,x,y+i*lh))}
