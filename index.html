<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>크레이음 인스타 스튜디오</title>
<style>
:root{--navy:#111b35;--mint:#55d8bd;--mint2:#e8fbf6;--coral:#ff6f7d;--coral2:#fff0f2;--cream:#fff3d1;--butter:#ffd65a;--paper:#fffaf3;--line:#dde4ed;--muted:#617084;--page:#f5f3ee;--white:#fff;--shadow:0 18px 45px rgba(17,27,53,.12)}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}button,input,select,textarea{font:inherit}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy);padding:0 14px;cursor:pointer;font-weight:850}.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.shell{display:grid;grid-template-columns:minmax(320px,390px) 1fr;min-height:100vh}.side{display:flex;flex-direction:column;gap:16px;padding:24px;background:rgba(255,255,255,.95);border-right:1px solid var(--line);overflow:auto}.brand{display:flex;align-items:center;gap:14px}.mark{display:grid;place-items:center;width:54px;height:54px;border-radius:8px;background:var(--navy);color:#fff;font-size:28px;font-weight:950}.eyebrow{margin:0 0 4px;color:var(--coral);font-size:12px;font-weight:950;text-transform:uppercase}.brand h1,.work h2,h3{margin:0}.panel{display:grid;gap:14px;padding:16px;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 8px 22px rgba(17,27,53,.05)}.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.seg label{position:relative}.seg input{position:absolute;opacity:0}.seg span{display:grid;place-items:center;min-height:42px;border:1px solid var(--line);border-radius:8px;background:#fafbfc;color:var(--muted);font-weight:950}.seg input:checked+span{background:var(--mint2);border-color:var(--navy);color:var(--navy)}label{display:grid;gap:7px;color:var(--muted);font-size:13px;font-weight:800}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy);padding:10px 11px;outline:none}textarea{resize:vertical}.drop,.mini{min-height:58px;align-content:center;justify-items:center;border:1px dashed #8ed8ca;border-radius:8px;background:var(--mint2);text-align:center;cursor:pointer}.drop{min-height:106px}.drop input,.mini input{display:none}.drop span,.mini span{font-weight:950;color:var(--navy)}.drop small{color:var(--muted);font-weight:650}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.swatches span{height:34px;border-radius:8px;border:1px solid var(--line)}.navy{background:var(--navy)}.mint{background:var(--mint)}.coral{background:var(--coral)}.cream{background:var(--cream)}.butter{background:var(--butter)}.motifs{display:flex;flex-wrap:wrap;gap:7px}.motifs span{padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:950}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.thumbs img{width:100%;aspect-ratio:1;border-radius:8px;object-fit:cover;border:1px solid var(--line)}.work{padding:24px;overflow:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.actions{display:flex;flex-wrap:wrap;gap:8px}.preview{display:grid;grid-template-columns:minmax(340px,570px) minmax(360px,1fr);gap:18px;align-items:start}.card,.copy{border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:var(--shadow)}.card{display:grid;gap:12px;padding:14px}canvas{display:block;width:100%;height:auto;border-radius:8px;background:var(--cream)}.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.st{display:grid;gap:6px;min-height:0;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}.st img{width:100%;aspect-ratio:4/5;object-fit:cover}.st span{padding:0 8px 8px;color:var(--muted);font-size:11px;font-weight:950;text-align:left}.st.on{border-color:var(--navy);box-shadow:0 0 0 3px rgba(85,216,189,.22)}.copy{display:grid;gap:12px;padding:14px}.section{display:grid;gap:8px}.section-title{display:flex;align-items:center;justify-content:space-between}.section-title button{min-height:32px;font-size:13px}.section textarea{min-height:120px;line-height:1.55}.check{display:grid;gap:9px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--mint2)}.check label{grid-template-columns:18px 1fr;color:var(--navy);font-weight:650}.check input{width:auto;margin-top:2px}@media(max-width:1050px){.shell,.preview{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}}@media(max-width:640px){.side,.work{padding:16px}.toolbar{align-items:stretch;flex-direction:column}.actions button{flex:1}.grid{grid-template-columns:1fr}.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="shell">
<aside class="side">
<div class="brand"><div class="mark">C</div><div><p class="eyebrow">CRE-EUM Studio</p><h1>크레이음 인스타 스튜디오</h1></div></div>
<section class="panel"><h3>콘텐츠 유형</h3><div class="seg"><label><input type="radio" name="type" value="hatching" checked><span>해칭</span></label><label><input type="radio" name="type" value="individual"><span>개체</span></label><label><input type="radio" name="type" value="care"><span>사육정보</span></label><label><input type="radio" name="type" value="reels"><span>릴스</span></label></div></section>
<section class="panel"><h3>크레이음 색감</h3><div class="swatches"><span class="navy"></span><span class="mint"></span><span class="coral"></span><span class="cream"></span><span class="butter"></span></div><div class="motifs"><span>C꼬리</span><span>하트매듭</span><span>3칸 이음길</span></div><label class="mini" for="logo"><input id="logo" type="file" accept="image/*"><span>로고/캐릭터 이미지</span></label></section>
<section class="panel"><h3>사진</h3><label class="drop" for="photos"><input id="photos" type="file" accept="image/*" multiple><span>개체 사진 2~4장 업로드</span><small>첫 사진은 정보 카드, 이후 사진은 큰 사진 카드로 제작됩니다.</small></label><div id="thumbs" class="thumbs"></div></section>
<section class="panel"><h3>개체정보</h3><div class="grid"><label>개체 ID<input id="id" placeholder="예: CR-260519-01"></label><label>모프<input id="morph" placeholder="예: 논릴리 / 모자이크"></label><label>해칭일<input id="date" type="date"></label><label>체중<input id="weight" placeholder="예: 5.8g"></label><label>부 개체<input id="sire" placeholder="예: Sire name"></label><label>모 개체<input id="dam" placeholder="예: Dam name"></label><label>먹이반응<select id="feeding"><option>안정적</option><option>관찰 중</option><option>매우 적극적</option><option>개체별 안내 필요</option></select></label><label>상태<select id="status"><option>성장 관찰 중</option><option>분양 상담 가능</option><option>예약 중</option><option>분양 완료</option></select></label></div><label>개체 메모<textarea id="notes" rows="4" placeholder="성격, 패턴 포인트, 관리 메모를 적어주세요."></textarea></label><label>사육정보 주제<input id="topic" placeholder="예: 온도 관리, 유체 단독사육, 먹이반응"></label></section>
</aside>
<section class="work"><header class="toolbar"><div><p class="eyebrow">Preview</p><h2>인스타 캐러셀 초안</h2></div><div class="actions"><button id="make" class="primary">자동 제작</button><button id="png">현재 PNG</button><button id="all">전체 PNG</button><button id="csv">Canva CSV</button></div></header><div class="preview"><section class="card"><canvas id="canvas" width="1080" height="1350"></canvas><div id="strip" class="strip"></div></section><section class="copy"><div class="section"><div class="section-title"><h3>캡션</h3><button data-copy="caption">복사</button></div><textarea id="caption"></textarea></div><div class="section"><div class="section-title"><h3>카드 문구</h3><button data-copy="slides">복사</button></div><textarea id="slides"></textarea></div><div class="section"><div class="section-title"><h3>릴스 구성</h3><button data-copy="reels">복사</button></div><textarea id="reels"></textarea></div><div class="check"><h3>업로드 전 확인</h3><label><input type="checkbox"> 개체 ID, 부모 정보, 해칭일 확인</label><label><input type="checkbox"> 건강/먹이반응 표현 과장 없음</label><label><input type="checkbox"> 사진 중심으로 보이는지 확인</label><label><input type="checkbox"> 사육정보 기준 확인</label></div></section></div></section>
</main>
<script>
const S={imgs:[],logo:null,sel:0,urls:[],specs:[]},$=id=>document.getElementById(id),C=$('canvas'),X=C.getContext('2d'),B={ko:'크레이음',en:'CRE-EUM',tag:'단 하나의 크레',handle:'@creime_official'},P={navy:'#111B35',mint:'#55D8BD',mint2:'#E8FBF6',coral:'#FF6F7D',coral2:'#FFF0F2',cream:'#FFF3D1',butter:'#FFD65A',butter2:'#FFF8D8',white:'#FFFFFF',paper:'#FFFCF7',line:'#DDE4ED',muted:'#617084'},T={hatching:{pillar:'해칭노트',badge:'HATCHING NOTE',primary:P.butter,accent:P.coral,soft:P.butter2,tag:'#해칭노트'},individual:{pillar:'이음매칭',badge:'MATCHING',primary:P.coral,accent:P.mint,soft:P.coral2,tag:'#이음매칭'},care:{pillar:'사육노트',badge:'CARE NOTE',primary:P.mint,accent:P.coral,soft:P.mint2,tag:'#사육노트'},reels:{pillar:'릴스훅',badge:'REELS HOOK',primary:P.navy,accent:P.coral,soft:'#F3F6FF',tag:'#크레릴스'}};
function type(){return document.querySelector('input[name="type"]:checked').value}function th(){return T[type()]}function v(id,fb=''){return $(id).value.trim()||fb}function date(){let d=$('date').value;if(!d)return'기록 예정';let x=new Date(d+'T00:00:00');return isNaN(x)?d:`${x.getFullYear()}.${String(x.getMonth()+1).padStart(2,'0')}.${String(x.getDate()).padStart(2,'0')}`}function safe(s){return String(s||'cre-eum').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,'-')}function read(f){return new Promise(r=>{let fr=new FileReader();fr.onload=()=>{let im=new Image();im.onload=()=>r({file:f,url:fr.result,img:im});im.src=fr.result};fr.readAsDataURL(f)})}
$('photos').onchange=async e=>{S.imgs=await Promise.all([...e.target.files].slice(0,4).map(read));S.sel=0;thumbs();make()};$('logo').onchange=async e=>{let f=e.target.files[0];if(!f)return;S.logo=await read(f);e.target.closest('label').querySelector('span').textContent='로고/캐릭터 적용됨';make()};function thumbs(){let t=$('thumbs');t.innerHTML='';S.imgs.forEach((a,i)=>{let im=new Image();im.src=a.url;im.alt=`${i+1}번 사진`;t.appendChild(im)})}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}function fill(x,y,w,h,r){rr(x,y,w,h,r);X.fill()}function stroke(x,y,w,h,r){rr(x,y,w,h,r);X.stroke()}function cover(im,x,y,w,h,r=28,fb='사진을 업로드해 주세요'){X.save();rr(x,y,w,h,r);X.clip();if(!im){X.fillStyle=P.mint2;X.fillRect(x,y,w,h);motif(x+w/2-76,y+h/2-58,.9,th());X.fillStyle=P.muted;X.font='800 30px Pretendard,sans-serif';X.textAlign='center';X.fillText(fb,x+w/2,y+h/2+96);X.restore();return}let sr=im.width/im.height,tr=w/h,sx=0,sy=0,sw=im.width,sh=im.height;if(sr>tr){sw=im.height*tr;sx=(im.width-sw)/2}else{sh=im.width/tr;sy=(im.height-sh)/2}X.drawImage(im,sx,sy,sw,sh,x,y,w,h);X.restore()}function contain(im,x,y,w,h){if(!im)return;let s=Math.min(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;X.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh)}function wrap(t,x,y,mw,lh,max=3){let units=String(t||'').split('\n').flatMap(p=>/\s/.test(p)?p.split(/(\s+)/).filter(Boolean):[...p]),lines=[],line='';units.forEach(u=>{let test=line+u;if(X.measureText(test).width>mw&&line){lines.push(line.trim());line=u.trimStart()}else line=test});if(line)lines.push(line.trim());lines=lines.slice(0,max);lines.forEach((l,i)=>X.fillText(l,x,y+i*lh));return y+lines.length*lh}function heart(cx,cy,s){let k=s/24;X.save();X.translate(cx,cy);X.scale(k,k);X.beginPath();X.moveTo(0,8);X.bezierCurveTo(-18,-4,-10,-20,0,-10);X.bezierCurveTo(10,-20,18,-4,0,8);X.closePath();X.fillStyle=P.coral;X.fill();X.lineWidth=3;X.strokeStyle=P.navy;X.stroke();X.restore()}function motif(x,y,s,t=th()){X.save();X.translate(x,y);X.scale(s,s);X.strokeStyle=P.navy;X.lineWidth=12;X.lineCap='round';X.beginPath();X.arc(84,82,66,Math.PI*.72,Math.PI*1.86);X.stroke();X.strokeStyle=t.accent;X.lineWidth=7;for(let i=0;i<3;i++){X.beginPath();X.moveTo(48+i*24,143);X.lineTo(57+i*24,116);X.stroke()}heart(139,49,26);X.restore()}function mark(x,y,s,t=th()){X.save();X.fillStyle=P.white;fill(x,y,s,s,18);X.strokeStyle='rgba(17,27,53,.13)';X.lineWidth=3;stroke(x,y,s,s,18);if(S.logo?.img){rr(x+8,y+8,s-16,s-16,14);X.clip();contain(S.logo.img,x+10,y+10,s-20,s-20);X.restore();return}X.fillStyle=P.navy;X.font=`900 ${Math.round(s*.48)}px Pretendard,sans-serif`;X.textAlign='center';X.textBaseline='middle';X.fillText('C',x+s/2,y+s/2+2);X.textBaseline='alphabetic';heart(x+s*.72,y+s*.28,s*.22);X.fillStyle=t.primary;X.beginPath();X.arc(x+s*.28,y+s*.74,s*.08,0,Math.PI*2);X.fill();X.restore()}function pill(text,right,y,fillc,color=P.navy){X.font='900 23px Pretendard,sans-serif';let w=X.measureText(text).width+38;X.fillStyle=fillc;fill(right-w,y,w,46,14);X.fillStyle=color;X.textAlign='left';X.fillText(text,right-w+19,y+31)}function bg(t){X.clearRect(0,0,C.width,C.height);X.fillStyle=P.paper;X.fillRect(0,0,C.width,C.height);X.strokeStyle='rgba(17,27,53,.09)';X.lineWidth=6;X.beginPath();X.arc(540,675,548,0,Math.PI*2);X.stroke();X.fillStyle=t.soft;fill(0,0,C.width,158,0);X.fillStyle=t.primary;fill(0,0,18,158,0)}function topbar(t,label,i,total){mark(66,48,76,t);X.fillStyle=P.navy;X.font='900 34px Pretendard,sans-serif';X.textAlign='left';X.fillText(B.en,160,83);X.fillStyle=P.muted;X.font='800 22px Pretendard,sans-serif';X.fillText(`${B.ko} · ${B.tag}`,160,116);pill(`${i}/${total}`,1012,58,P.white);pill(label,900,58,t.primary,label.length>10?P.white:P.navy)}function footer(t){X.strokeStyle=t.accent;X.lineWidth=8;X.lineCap='round';X.beginPath();X.moveTo(70,1284);X.lineTo(220,1284);X.stroke();X.strokeStyle=t.primary;for(let i=0;i<3;i++){X.beginPath();X.moveTo(254+i*25,1298);X.lineTo(264+i*25,1270);X.stroke()}X.fillStyle=P.muted;X.font='800 22px Pretendard,sans-serif';X.textAlign='right';X.fillText(`${B.handle} | ${B.en}`,1010,1294)}function chip(a,x,y,w,t){X.fillStyle=P.white;fill(x,y,w,70,16);X.strokeStyle='rgba(17,27,53,.08)';X.lineWidth=2;stroke(x,y,w,70,16);X.fillStyle=t.accent;X.font='900 16px Pretendard,sans-serif';X.textAlign='left';X.fillText(a[0],x+18,y+27);X.fillStyle=P.navy;X.font='900 23px Pretendard,sans-serif';wrap(a[1],x+18,y+55,w-36,28,1)}
function content(){let t=th(),id=v('id','CRE-EUM PICK'),m=v('morph','크레스티드게코'),fed=v('feeding','안정적'),st=v('status','성장 관찰 중'),note=v('notes','개체의 컨디션과 먹이반응을 차분히 확인하며 크레이음 기준에 맞춰 관리 중입니다.'),base={t,id,m,badge:t.badge,photo:'크레이음 픽',head:`${m} ${id}`,note,meta:[['개체 ID',id],['모프',m],['해칭일',date()],['체중',v('weight','기록 중')]]};if(type()==='hatching')return{...base,photo:'새로 만난 작은 시작',head:'해칭 기록, 첫 번째 이음',note:`${m} 라인에서 만난 개체입니다. 부 ${v('sire','기록 중')} · 모 ${v('dam','기록 중')}`,meta:[['개체 ID',id],['해칭일',date()],['먹이반응',fed],['상태',st]]};if(type()==='individual')return{...base,photo:'이음매칭 개체',head:`${id} 개체 소개`,note:`${m} · ${st}. 사진보다 실제 패턴과 컨디션을 함께 보고 안내합니다.`,meta:[['모프',m],['체중',v('weight','기록 중')],['먹이반응',fed],['상태',st]]};if(type()==='care')return{...base,photo:'사육노트',head:v('topic','사육환경 체크'),note:note,meta:[['주제',v('topic','사육환경 체크')],['기준','안정 우선'],['대상','초보 사육자'],['브랜드',B.ko]]};return{...base,photo:'릴스용 컷',head:'3초 안에 시선을 잡는 컷',note:`${m}의 포인트를 크게 보여주고, 마지막은 맞춤 상담으로 자연스럽게 연결합니다.`,meta:[['첫 장면','얼굴/패턴'],['중간','움직임'],['마무리','상담 CTA'],['톤','귀엽고 선명']]}}
function specs(){let ims=S.imgs.map(a=>a.img),n=Math.min(4,Math.max(2,ims.length||1)),r=[{type:'info',img:ims[0]||null}];for(let i=1;i<n;i++)r.push({type:'photo',img:ims[i]||ims[0]||null});return r}function draw(sp,c,i,total){sp.type==='info'?info(sp,c,i,total):photo(sp,c,i,total)}function info(sp,c,i,total){bg(c.t);topbar(c.t,c.badge,i+1,total);cover(sp.img,70,220,940,670,30);X.fillStyle='rgba(255,255,255,.88)';fill(92,242,208,58,18);X.fillStyle=P.navy;X.font='900 24px Pretendard,sans-serif';X.textAlign='left';X.fillText('01 정보 카드',120,279);X.fillStyle=P.white;fill(70,926,940,294,28);X.strokeStyle='rgba(17,27,53,.08)';X.lineWidth=2;stroke(70,926,940,294,28);X.fillStyle=c.t.accent;fill(70,926,14,294,7);X.fillStyle=P.navy;X.font='900 42px Pretendard,sans-serif';wrap(c.head,110,986,820,50,2);X.fillStyle=P.muted;X.font='800 23px Pretendard,sans-serif';wrap(c.note,110,1055,820,32,2);c.meta.slice(0,4).forEach((a,j)=>chip(a,110+j*215,1124,200,c.t));motif(790,1180,.62,c.t);footer(c.t)}function photo(sp,c,i,total){bg(c.t);topbar(c.t,'PHOTO CARD',i+1,total);cover(sp.img,70,184,940,970,32);X.fillStyle='rgba(255,255,255,.9)';fill(820,212,150,150,24);mark(840,232,110,c.t);X.fillStyle=P.white;fill(70,1178,940,94,24);X.strokeStyle='rgba(17,27,53,.08)';X.lineWidth=2;stroke(70,1178,940,94,24);X.fillStyle=c.t.primary;fill(70,1178,14,94,7);X.fillStyle=P.navy;X.font='900 32px Pretendard,sans-serif';X.textAlign='left';wrap(c.photo,110,1230,560,38,1);X.fillStyle=P.muted;X.font='800 22px Pretendard,sans-serif';X.textAlign='right';X.fillText(`${c.id} · ${c.m}`,970,1230);footer(c.t)}function make(){let c=content(),sp=specs();S.specs=sp;if(S.sel>=sp.length)S.sel=0;S.urls=sp.map((s,i)=>{draw(s,c,i,sp.length);return C.toDataURL('image/png')});draw(sp[S.sel],c,S.sel,sp.length);render();$('caption').value=caption(c);$('slides').value=slideText(sp,c);$('reels').value=reels(c)}function render(){let r=$('strip');r.innerHTML='';S.urls.forEach((u,i)=>{let b=document.createElement('button');b.type='button';b.className='st'+(S.sel===i?' on':'');let im=new Image();im.src=u;let s=document.createElement('span');s.textContent=i===0?'1 정보 카드':`${i+1} 큰 사진`;b.append(im,s);b.onclick=()=>{S.sel=i;draw(S.specs[i],content(),i,S.specs.length);render()};r.appendChild(b)})}function caption(c){let tags=`#크레이음 #CREEUM ${c.t.tag} #크레스티드게코 #크레분양 #올바른사육정보 #논릴리 #모자이크`;if(type()==='hatching')return`[${c.t.pillar}]\n새로운 해칭 기록입니다.\n\n개체 ID: ${c.id}\n모프: ${c.m}\n해칭일: ${date()}\n부: ${v('sire','기록 중')} / 모: ${v('dam','기록 중')}\n\n크레이음은 작은 시작부터 성장 과정까지 차분히 기록하고, 개체 상태와 사육 환경을 함께 확인한 뒤 안내합니다.\n\n${tags}`;if(type()==='care')return`[${c.t.pillar}]\n${v('topic','사육환경 체크')}\n\n크레스티드게코 사육은 온도, 습도, 환기, 은신처, 먹이반응을 함께 보는 과정입니다.\n\n${v('notes','개체의 반응을 기준으로 환경을 천천히 조정해 주세요.')}\n\n${tags}`;return`[${c.t.pillar}]\n${c.id} 개체 소개\n\n모프: ${c.m}\n체중: ${v('weight','기록 중')}\n먹이반응: ${v('feeding','안정적')}\n상태: ${v('status','성장 관찰 중')}\n\n${v('notes','사진보다 실제 컨디션, 패턴, 성향을 함께 보고 안내합니다.')}\n\n단 하나의 크레를 이어주는 것이 크레이음의 기준입니다.\n\n${tags}`}function slideText(sp,c){return sp.map((s,i)=>s.type==='info'?`${i+1}장: 큰 사진 + 핵심 정보 카드`:`${i+1}장: 사진을 크게 보여주는 개체 컷`).concat(['',`톤: ${B.en} / ${c.t.pillar} / 사진 중심`]).join('\n')}function reels(c){return type()==='care'?`릴스 대본\n0-2초: “${v('topic','사육환경 체크')}, 이것부터 보세요”\n3-6초: 사육장 전체 컷\n7-11초: 핵심 2가지\n12-15초: “개체 반응까지 보고 조정하세요”`:`릴스 대본\n0-2초: 얼굴 또는 패턴 클로즈업\n3-5초: ${c.m} 포인트 컷\n6-9초: 손 위 움직임 또는 먹이반응\n10-13초: 전체 체형 컷\n14-16초: “단 하나의 크레, 크레이음에서 이음”`}function down(url,name){let a=document.createElement('a');a.href=url;a.download=name;a.click()}$('make').onclick=make;$('png').onclick=()=>{let c=content();draw(S.specs[S.sel]||specs()[0],c,S.sel,(S.specs.length||2));down(C.toDataURL('image/png'),`${safe(v('id','cre-eum'))}-card-${S.sel+1}.png`)};$('all').onclick=()=>{make();S.urls.forEach((u,i)=>setTimeout(()=>down(u,`${safe(v('id','cre-eum'))}-card-${i+1}.png`),i*220))};$('csv').onclick=()=>{let rows=[['Slide','Type','Brand','Title','ImageFile'],...S.specs.map((s,i)=>[i+1,s.type,B.en,i?'Photo':'Info',S.imgs[i]?.file.name||S.imgs[0]?.file.name||'upload-image'])],csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv'}),url=URL.createObjectURL(blob);down(url,`${safe(v('id','cre-eum'))}-canva.csv`);URL.revokeObjectURL(url)};document.querySelectorAll('input,select,textarea').forEach(e=>{if(e.type==='file'||e.type==='radio')return;e.oninput=make;e.onchange=make});document.querySelectorAll('input[name="type"]').forEach(e=>e.onchange=()=>{S.sel=0;make()});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText($(b.dataset.copy).value));make();
</script>
